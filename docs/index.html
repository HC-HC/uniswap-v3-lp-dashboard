<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uniswap v3 LP Dashboard — WETH/USDC</title>
<link rel="icon" href="data:,">
<style>
:root {
  color-scheme: dark;
  --bg: #0e0e0d; --panel: #151514; --panel-2: #1c1c1a; --rule: #2a2a27; --rule-2: #36352f;
  --text: #ecebe6; --text-2: #b8b7ae; --muted: #85847c;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-7: #9085e9;
  --band: rgba(57,135,229,.13); --band-edge: #3987e5; --bar: #4a4944; --bar-in: #3987e5;
  --good: #3fbf72; --warn: #e0a030; --bad: #e66767;
  --k-observed: #3fbf72; --k-derived: #6da7ec; --k-estimated: #e0a030; --k-assumed: #a3a29a; --k-mixed: #9085e9;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f1f0ec; --panel: #fbfbf9; --panel-2: #f2f1ed; --rule: #e2e0d9; --rule-2: #d3d1c8;
  --text: #0b0b0b; --text-2: #4f4e4a; --muted: #7a7974;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-7: #6250d6;
  --band: rgba(42,120,214,.10); --band-edge: #2a78d6; --bar: #c9c7bf; --bar-in: #2a78d6;
  --good: #0a7d3b; --warn: #a86500; --bad: #c0352f;
  --k-observed: #0a7d3b; --k-derived: #2a6cc0; --k-estimated: #a86500; --k-assumed: #6b6a66; --k-mixed: #6250d6;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 11.5px/1.35 var(--sans); }
a { color: var(--series-1); text-decoration: none; } a:hover { text-decoration: underline; }
.n, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.pos { color: var(--good); } .neg { color: var(--bad); } .mut { color: var(--muted); } .t2 { color: var(--text-2); }

/* app frame */
.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; min-height: 720px; }
@media (max-width: 1100px) { .app { height: auto; } }

/* top strip */
.strip { display: flex; align-items: stretch; border-bottom: 1px solid var(--rule); background: var(--panel); overflow-x: auto; white-space: nowrap; }
.strip .brand { padding: 6px 12px; border-right: 1px solid var(--rule); display: flex; flex-direction: column; justify-content: center; }
.strip .brand b { font-size: 12px; letter-spacing: .02em; }
.strip .brand span { color: var(--muted); font-size: 10.5px; }
.stat { padding: 5px 12px; border-right: 1px solid var(--rule); display: flex; flex-direction: column; justify-content: center; }
.stat .k { color: var(--muted); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; display: flex; gap: 5px; align-items: center; }
.stat .v { font: 600 13px var(--mono); }
.stat .v small { font-weight: 400; color: var(--text-2); font-size: 11px; }
.stat.big .v { font-size: 16px; }
.strip .right { margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 0 10px; }
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.prov { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex: none; }
.prov.observed { background: var(--k-observed); } .prov.derived { background: var(--k-derived); } .prov.estimated { background: var(--k-estimated); } .prov.assumed { background: var(--k-assumed); } .prov.mixed { background: var(--k-mixed); }

/* main grid */
.main { display: grid; grid-template-columns: 228px minmax(0, 1fr) 340px; min-height: 0; }
@media (max-width: 1100px) { .main { grid-template-columns: 1fr; } }
.col { min-height: 0; overflow: auto; border-right: 1px solid var(--rule); }
.col:last-child { border-right: 0; }
.center { display: grid; grid-template-rows: minmax(300px, 1fr) auto; min-height: 0; overflow: hidden; }
@media (max-width: 1100px) { .center { overflow: visible; } }
.sec { border-bottom: 1px solid var(--rule); padding: 8px 10px; }
.sec:last-child { border-bottom: 0; }
.sec h3 { margin: 0 0 6px; font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.sec h3 .h-r { text-transform: none; letter-spacing: 0; font-weight: 400; }

/* inputs */
label.f { display: block; margin-bottom: 6px; }
label.f > span { display: flex; justify-content: space-between; color: var(--text-2); font-size: 10.5px; margin-bottom: 2px; }
label.f > span small { color: var(--muted); }
input[type=number], input[type=text], select, textarea { width: 100%; font: 12px var(--mono); color: var(--text); background: var(--panel-2); border: 1px solid var(--rule-2); border-radius: 3px; padding: 4px 6px; }
input:focus, select:focus, textarea:focus { outline: 1px solid var(--series-1); border-color: var(--series-1); }
textarea { font-size: 10.5px; min-height: 60px; }
.r2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 3px; margin: 2px 0 8px; }
button { font: 600 11px var(--sans); color: var(--text); background: var(--panel-2); border: 1px solid var(--rule-2); border-radius: 3px; padding: 4px 8px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.on, button.primary { background: var(--series-1); border-color: var(--series-1); color: #fff; }
.chips button { font: 500 10.5px var(--mono); padding: 2px 5px; }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 3px; overflow: hidden; width: 100%; }
.seg button { border: 0; border-radius: 0; flex: 1; padding: 4px 4px; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--rule-2); }
details summary { cursor: pointer; color: var(--text-2); font-size: 10.5px; margin: 4px 0 6px; }
.actions { display: flex; gap: 4px; flex-wrap: wrap; }
.status { font-size: 11px; padding: 5px 7px; border-radius: 3px; margin-top: 6px; display: none; }
.status.err { display: block; background: color-mix(in srgb, var(--bad) 14%, transparent); border: 1px solid var(--bad); }
.status.ok { display: block; background: color-mix(in srgb, var(--good) 12%, transparent); border: 1px solid var(--good); }
.note { font-size: 10.5px; color: var(--text-2); background: var(--panel-2); border: 1px dashed var(--rule-2); border-radius: 3px; padding: 5px 7px; margin-bottom: 8px; }

/* chart */
.chartwrap { position: relative; min-height: 0; padding: 4px 6px 0; display: flex; flex-direction: column; }
.chartwrap .legend { display: flex; gap: 12px; font-size: 10.5px; color: var(--text-2); padding: 2px 4px 2px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 4px; }
.legend i.box { height: 8px; width: 10px; }
.chart { position: relative; flex: 1; min-height: 0; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart svg text { font: 10px var(--sans); fill: var(--muted); }
.chart svg .lab { font: 600 10.5px var(--mono); }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--rule-2); border-radius: 3px; padding: 5px 7px; font: 11px var(--mono); box-shadow: 0 6px 18px rgba(0,0,0,.25); white-space: nowrap; display: none; z-index: 5; color: var(--text); }
.mini { height: 150px; }

/* tables */
table { border-collapse: collapse; width: 100%; }
th, td { padding: 3px 6px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 11px; }
th { font: 600 9.5px var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); text-align: right; border-bottom: 1px solid var(--rule-2); }
th:first-child, td:first-child { text-align: left; }
tr.sel td { background: var(--band); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel-2); }
.cmp { border-top: 1px solid var(--rule); overflow-x: auto; }
.cmp .cap { display: flex; justify-content: space-between; padding: 5px 10px 3px; font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.cmp .cap span { text-transform: none; letter-spacing: 0; font-weight: 400; }
th.grp { text-align: center; border-bottom: 1px solid var(--rule); font-size: 9px; }
.best { color: var(--text); font-weight: 700; }
.best::after { content: " ●"; color: var(--series-1); font-size: 8px; vertical-align: middle; }

/* right column KPIs */
.hero { display: flex; align-items: baseline; gap: 8px; }
.hero .v { font: 700 24px var(--mono); letter-spacing: -.02em; }
.hero .s { color: var(--text-2); font: 12px var(--mono); }
.kgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 6px; }
.kgrid .k { color: var(--muted); font-size: 9.5px; letter-spacing: .04em; text-transform: uppercase; display: flex; gap: 4px; align-items: center; }
.kgrid .v { font: 600 13px var(--mono); }
.kgrid .v small { font-weight: 400; color: var(--text-2); font-size: 10.5px; }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
dl.kv dt { color: var(--muted); font-size: 10.5px; }
dl.kv dd { margin: 0; text-align: right; font: 11px var(--mono); }
.warns { display: flex; flex-direction: column; gap: 3px; }
.warn { font-size: 10.5px; padding: 3px 6px; border-left: 2px solid var(--warn); background: var(--panel-2); color: var(--text-2); }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule); margin: -2px -10px 6px; padding: 0 10px; }
.tabs button { border: 0; background: none; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); padding: 5px 7px; font-weight: 600; font-size: 10.5px; }
.tabs button.on { color: var(--text); border-bottom-color: var(--series-1); background: none; }
.tabpane { display: none; } .tabpane.on { display: block; }
.srcs td, .srcs th { font-size: 10.5px; } .srcs td:first-child { font-family: var(--sans); }
ol.as { margin: 0; padding-left: 16px; color: var(--text-2); font-size: 10.5px; } ol.as li { margin-bottom: 3px; }
.legend-prov { display: flex; gap: 8px; flex-wrap: wrap; font-size: 10px; color: var(--text-2); margin-top: 6px; }
.legend-prov span { display: inline-flex; gap: 4px; align-items: center; }
.busy { opacity: .6; transition: opacity .12s; }
pre.code { font: 10.5px var(--mono); background: var(--panel-2); padding: 6px; border-radius: 3px; white-space: pre-wrap; word-break: break-all; margin: 4px 0 0; max-height: 120px; overflow: auto; }
@media (max-width: 1400px) {
  .strip .brand span { display: none; }
  .stat { padding: 5px 9px; }
  .main { grid-template-columns: 212px minmax(0, 1fr) 316px; }
  th, td { padding: 3px 4px; font-size: 10.5px; }
}
.mini { height: 175px; }
.col { overflow-x: hidden; }
#saved table { table-layout: fixed; }
#saved td:first-child { overflow: hidden; text-overflow: ellipsis; font-family: var(--sans); width: 100%; }
#saved td:last-child { width: 100px; }
#saved button { padding: 2px 5px; }

</style>
<style>
.main.simple { grid-template-columns: 236px minmax(0, 1fr) 330px; }
@media (max-width: 1100px) { .main.simple { grid-template-columns: 1fr; } }
.hint { color: var(--muted); font-size: 10.5px; margin: 2px 0 0; }
ul.howto { margin: 0; padding-left: 15px; color: var(--text-2); font-size: 11.5px; line-height: 1.45; }
ul.howto li { margin-bottom: 5px; }
ul.howto.small { font-size: 10.5px; }
ul.howto b { color: var(--text); }
.answer .q { padding: 8px 0 9px; border-bottom: 1px solid var(--rule); }
.answer .q:last-child { border-bottom: 0; }
.answer .ql { color: var(--muted); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
.answer .qv { font: 700 24px var(--mono); letter-spacing: -.02em; margin: 2px 0 1px; }
.answer .qs { color: var(--text-2); font-size: 11.5px; line-height: 1.4; }
.answer .bottom .qv { font-size: 28px; }
.cmp td, .cmp th { font-size: 12px; padding: 4px 8px; }
.cmp th { font-size: 10px; }
.nw { white-space: nowrap; }
@media (max-width: 1400px) {
  .main.simple { grid-template-columns: 210px minmax(0, 1fr) 296px; }
  .cmp td, .cmp th { font-size: 11px; padding: 4px 5px; }
  .answer .qv { font-size: 21px; } .answer .bottom .qv { font-size: 24px; }
}
.foot { color: var(--muted); font-size: 10px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.answer .qs { font-family: var(--mono); font-size: 11px; }
#scn td, #scn th { font-size: 11px; padding: 2px 5px; }
.answer .q { padding: 6px 0 7px; }
.answer .qv { font-size: 21px; } .answer .bottom .qv { font-size: 24px; }
.ql .prov, .k .prov, h3 .prov, .cap .prov, .legend .prov { width: 6px; height: 6px; display: inline-block; vertical-align: middle; margin-left: 2px; }
.foot { gap: 10px; } .foot span { display: inline-flex; gap: 4px; align-items: center; }
.strip .right button { padding: 3px 8px; }
.mini-seg { width: auto; display: inline-flex; vertical-align: middle; }
.mini-seg button { padding: 2px 9px; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }
.tierwarn { padding: 4px 10px 6px; font-size: 10.5px; color: var(--warn); }
.tierwarn div { margin-bottom: 2px; }
#tierTable td, #tierTable th { font-size: 11.5px; padding: 4px 7px; }
.mini-seg button { white-space: nowrap; }
@media (max-width: 1400px) { #tierTable td, #tierTable th { font-size: 10.5px; padding: 3px 4px; } }

</style>
</head>
<body>
<div class="app">
  <div class="strip">
    <div class="brand"><b>UNISWAP V3 LP DASHBOARD</b><span>WETH/USDC 0.05% pool · Ethereum</span></div>
    <div id="stripStats" style="display:flex"></div>
    <div class="right">
      <span class="mono mut" id="asOf" style="font-size:10.5px"></span>
      <button id="saveBtn" title="Save these inputs + this data snapshot">Save</button>
      <button id="verifyBtn" title="Recompute the saved analysis from its snapshot and compare result hashes">Verify</button>
      <span class="mono" id="repro" style="font-size:10.5px"></span>
      <button id="themeBtn" title="Light / dark">◐</button>
    </div>
  </div>

  <div class="main simple">
    <!-- LEFT: four inputs -->
    <div class="col">
      <div class="sec">
        <h3>Position</h3>
        <form id="form" autocomplete="off">
          <label class="f"><span>Deposit <small>USD</small></span><input id="capitalUsd" type="number" step="any" value="10000"></label>
          <label class="f"><span>Lower</span><input id="rangeLower" type="number" step="any"></label>
          <label class="f"><span>Upper</span><input id="rangeUpper" type="number" step="any"></label>
          <div class="chips" id="widthChips"></div>
          <label class="f"><span>Days</span><input id="horizonDays" type="number" value="30"></label>
        </form>
        <div id="formStatus" class="status"></div>
      </div>
    </div>

    <!-- CENTER: chart + simple table -->
    <div class="center">
      <div class="chartwrap">
        <div class="legend">
          <span><i style="background:var(--text)"></i>Price <i class="prov observed"></i></span>
          <span><i class="box" style="background:var(--band);outline:1px solid var(--band-edge)"></i>Range</span>
          <span><i style="background:var(--series-7)"></i>Forecast 90% <i class="prov estimated"></i></span>
          <span><i class="box" style="background:var(--bar)"></i>Liquidity <i class="prov derived"></i></span>
        </div>
        <div class="chart" id="priceChart"></div>
      </div>
      <div class="cmp">
        <div class="cap"><span class="seg mini-seg" id="cmpSeg"><button type="button" data-v="widths" class="on">Widths</button><button type="button" data-v="tiers">Fee tiers</button></span> <i class="prov estimated"></i> <span id="cmpNote"></span></div>
        <table id="cmpTable"></table>
        <table id="tierTable" hidden></table>
        <div class="tierwarn" id="tierWarn" hidden></div>
      </div>
    </div>

    <!-- RIGHT: the answer -->
    <div class="col">
      <div class="sec answer">
        <h3>Result</h3>
        <div class="q"><div class="ql">Fees <i class="prov estimated"></i></div><div class="qv n" id="aFees"></div><div class="qs" id="aFeesS"></div></div>
        <div class="q"><div class="ql">Time in range <i class="prov estimated"></i></div><div class="qv n" id="aTime"></div><div class="qs" id="aTimeS"></div></div>
        <div class="q"><div class="ql">Loss at edge vs hold <i class="prov derived"></i></div><div class="qv n neg" id="aEdge"></div><div class="qs" id="aEdgeS"></div></div>
        <div class="q bottom"><div class="ql">Net vs hold <i class="prov estimated"></i></div><div class="qv n" id="aNet"></div><div class="qs" id="aNetS"></div></div>
        <div class="q"><div class="ql">Break-even volume <i class="prov estimated"></i></div><div class="qv n" id="aBe"></div><div class="qs" id="aBeS"></div></div>
      </div>
      <div class="sec">
        <h3><span>Deposit <i class="prov derived"></i></span></h3>
        <dl class="kv" id="deposit"></dl>
      </div>
      <div class="sec">
        <h3><span>Scenarios <i class="prov estimated"></i></span><span class="h-r mut" id="scnSub"></span></h3>
        <table id="scn"></table>
      </div>
      <div class="sec foot" id="foot"></div>
    </div>
  </div>
</div>
<script>
/* SVG charts for Uniswap v3 LP Dashboard. No dependencies. window.Charts */
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, a = {}, p) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(a)) if (v != null) n.setAttribute(k, v); if (p) p.appendChild(n); return n; };
  const lin = (d0, d1, r0, r1) => { const f = (v) => r0 + ((v - d0) / (d1 - d0 || 1)) * (r1 - r0); f.inv = (p) => d0 + ((p - r0) / (r1 - r0)) * (d1 - d0); return f; };
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const path = (pts) => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
  function ticks(min, max, n = 5) {
    const span = max - min || 1, m = Math.pow(10, Math.floor(Math.log10(span / n)));
    const step = [1, 2, 2.5, 5, 10].map((k) => k * m).find((s) => span / s <= n + 0.5) || m * 10;
    const out = []; for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(+v.toFixed(10)); return out;
  }
  const kfmt = (v) => Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : Math.abs(v) >= 1e4 ? (v / 1e3).toFixed(0) + 'k' : Math.abs(v) >= 1000 ? (v / 1e3).toFixed(1) + 'k' : (+v.toPrecision(3)).toString();

  function frame(c, pad = {}) {
    c.innerHTML = '';
    const W = Math.max(300, c.clientWidth), H = Math.max(120, c.clientHeight || 150);
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none' }, c);
    const tip = document.createElement('div'); tip.className = 'tip'; c.appendChild(tip);
    return { svg, tip, W, H, l: pad.l ?? 44, r: W - (pad.r ?? 8), t: pad.t ?? 6, b: H - (pad.b ?? 18) };
  }
  const pt = (f, e) => { const r = f.svg.getBoundingClientRect(); return { x: (e.clientX - r.left) * (f.W / r.width), y: (e.clientY - r.top) * (f.H / r.height) }; };
  function tip(f, html, x, y) {
    f.tip.innerHTML = html; f.tip.style.display = 'block';
    const s = f.svg.clientWidth / f.W, w = f.tip.offsetWidth, h = f.tip.offsetHeight;
    let L = x * s + 12; if (L + w > f.svg.clientWidth) L = x * s - w - 12;
    let T = y * s - h / 2; T = Math.max(0, Math.min(T, f.svg.clientHeight - h));
    f.tip.style.left = L + 'px'; f.tip.style.top = T + 'px';
  }
  const hide = (f) => { f.tip.style.display = 'none'; };

  /**
   * Price history + forward cone (left) and liquidity profile (right), sharing one price axis,
   * with a draggable range band across both.
   */
  function priceProfile(c, o) {
    const PROFILE_W = Math.min(200, Math.max(120, c.clientWidth * 0.2));
    const f = frame(c, { l: 50, r: 8, t: 8, b: 18 });
    const xSplit = f.r - PROFILE_W, gap = 10;
    const hist = o.history, nH = hist.length, nF = o.cone.length;
    const xs = lin(0, nH + nF, f.l, xSplit - gap);
    const yVals = [o.range.lower, o.range.upper, o.spot, ...hist.slice(-Math.min(nH, 30)).flatMap((d) => [d.low, d.high]), ...o.cone.flatMap((c2) => [c2.p5, c2.p95])];
    let lo = Math.min(...yVals), hi = Math.max(...yVals); const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
    lo = Math.max(lo, o.bars[0].priceLow); hi = Math.min(hi, o.bars[o.bars.length - 1].priceHigh);
    const y = lin(lo, hi, f.b, f.t);
    const cid = 'clip' + Math.random().toString(36).slice(2, 8);
    el('rect', { x: f.l, y: f.t, width: f.r - f.l, height: f.b - f.t }, el('clipPath', { id: cid }, el('defs', {}, f.svg)));
    const g = el('g', {}, f.svg);
    for (const t of ticks(lo, hi, 7)) {
      el('line', { x1: f.l, x2: f.r, y1: y(t), y2: y(t), stroke: css('--rule'), 'stroke-width': 1 }, g);
      el('text', { x: f.l - 5, y: y(t) + 3, 'text-anchor': 'end' }, g).textContent = t.toLocaleString('en-US');
    }
    hist.forEach((d, i) => { if (i % 14 === 0) el('text', { x: xs(i + 0.5), y: f.H - 5, 'text-anchor': 'middle' }, g).textContent = d.date.slice(5); });
    el('text', { x: xs(nH + nF / 2), y: f.H - 5, 'text-anchor': 'middle' }, g).textContent = o.simple ? `+${nF}d` : `+${nF}d (model)`;
    el('line', { x1: xs(nH), x2: xs(nH), y1: f.t, y2: f.b, stroke: css('--rule-2'), 'stroke-dasharray': '2 3' }, g);
    const P = el('g', { 'clip-path': `url(#${cid})` }, f.svg);
    // band
    const band = el('rect', { x: f.l, width: f.r - f.l, fill: css('--band') }, P);
    // profile bars
    const maxL = Math.max(...o.bars.map((b) => b.L || 0));
    const xp = lin(0, maxL, xSplit, f.r);
    const barEls = o.bars.map((b) => {
      if (!b.L || b.priceHigh < lo || b.priceLow > hi) return null;
      const y1 = y(Math.min(b.priceHigh, hi)), y2 = y(Math.max(b.priceLow, lo));
      return { b, r: el('rect', { x: xSplit, y: y1 + 0.5, width: Math.max(1, xp(b.L) - xSplit), height: Math.max(1, y2 - y1 - 1), fill: css('--bar') }, P) };
    }).filter(Boolean);
    el('line', { x1: xp(o.activeL), x2: xp(o.activeL), y1: f.t, y2: f.b, stroke: css('--muted'), 'stroke-dasharray': '2 2' }, f.svg);
    el('text', { x: xp(o.activeL) + 3, y: f.t + 9, style: 'font-size:9px' }, f.svg).textContent = o.simple ? 'current' : 'active L';
    // cone
    const cone = [[xs(nH), y(o.spot)], ...o.cone.map((c2, i) => [xs(nH + i + 1), y(c2.p95)])].concat([...o.cone].reverse().map((c2, i) => [xs(nH + o.cone.length - i), y(c2.p5)]), [[xs(nH), y(o.spot)]]);
    el('path', { d: path(cone) + 'Z', fill: css('--series-7'), 'fill-opacity': 0.12, stroke: 'none' }, P);
    el('path', { d: path([[xs(nH), y(o.spot)], ...o.cone.map((c2, i) => [xs(nH + i + 1), y(c2.p50)])]), fill: 'none', stroke: css('--series-7'), 'stroke-width': 1.5, 'stroke-dasharray': '4 3' }, P);
    for (const k of ['p5', 'p95']) el('path', { d: path([[xs(nH), y(o.spot)], ...o.cone.map((c2, i) => [xs(nH + i + 1), y(c2[k])])]), fill: 'none', stroke: css('--series-7'), 'stroke-width': 1, 'stroke-opacity': 0.6 }, P);
    // candles + close
    hist.forEach((d, i) => el('line', { x1: xs(i + 0.5), x2: xs(i + 0.5), y1: y(d.high), y2: y(d.low), stroke: css('--muted'), 'stroke-width': 1.5, 'stroke-opacity': 0.55 }, P));
    el('path', { d: path(hist.map((d, i) => [xs(i + 0.5), y(d.close)]).concat([[xs(nH), y(o.spot)]])), fill: 'none', stroke: css('--text'), 'stroke-width': 1.5 }, P);
    // spot line
    el('line', { x1: xs(nH), x2: f.r, y1: y(o.spot), y2: y(o.spot), stroke: css('--text'), 'stroke-width': 1, 'stroke-dasharray': '1 2' }, f.svg);
    el('circle', { cx: xs(nH), cy: y(o.spot), r: 3.5, fill: css('--text') }, f.svg);
    const sl = el('text', { x: xSplit - gap - 4, y: y(o.spot) - 4, 'text-anchor': 'end', class: 'lab', style: `fill:${css('--text')}` }, f.svg); sl.textContent = o.spot.toFixed(2);
    // draggable bounds
    const B = { lower: o.range.lower, upper: o.range.upper };
    const mk = (key) => {
      const gl = el('g', { style: 'cursor:ns-resize' }, f.svg);
      const hit = el('rect', { x: f.l, width: f.r - f.l, height: 12, fill: 'transparent' }, gl);
      const ln = el('line', { x1: f.l, x2: f.r, stroke: css('--band-edge'), 'stroke-width': 1.5 }, gl);
      const tag = el('rect', { x: f.l, width: 118, height: 14, rx: 2, fill: css('--band-edge') }, gl);
      const tx = el('text', { x: f.l + 4, class: 'lab', style: 'fill:#fff;font-size:10px' }, gl);
      return { key, gl, hit, ln, tag, tx };
    };
    const Lh = mk('lower'), Uh = mk('upper');
    const place = () => {
      band.setAttribute('y', y(B.upper)); band.setAttribute('height', Math.max(0, y(B.lower) - y(B.upper)));
      for (const h of [Lh, Uh]) {
        const yy = y(B[h.key]);
        h.ln.setAttribute('y1', yy); h.ln.setAttribute('y2', yy); h.hit.setAttribute('y', yy - 6);
        const ty = h.key === 'upper' ? yy - 14 : yy; h.tag.setAttribute('y', ty); h.tx.setAttribute('y', ty + 10.5);
        h.tx.textContent = `${h.key === 'upper' ? '▲' : '▼'} ${B[h.key].toFixed(2)}  ${((B[h.key] / o.spot - 1) * 100).toFixed(1)}%`;
      }
      for (const be of barEls) be.r.setAttribute('fill', be.b.priceHigh > B.lower && be.b.priceLow < B.upper ? css('--bar-in') : css('--bar'));
    };
    place();
    let drag = null;
    for (const h of [Lh, Uh]) {
      h.gl.addEventListener('pointerdown', (e) => { drag = h.key; h.gl.setPointerCapture(e.pointerId); e.preventDefault(); });
      h.gl.addEventListener('pointermove', (e) => {
        if (drag !== h.key) return;
        const v = y.inv(pt(f, e).y);
        if (h.key === 'lower') B.lower = Math.max(lo, Math.min(v, B.upper * 0.998)); else B.upper = Math.min(hi, Math.max(v, B.lower * 1.002));
        place();
        o.onDrag && o.onDrag({ ...B });
      });
      h.gl.addEventListener('pointerup', () => { if (drag) { drag = null; o.onRangeChange && o.onRangeChange({ ...B }); } });
    }
    // hover
    const hov = el('rect', { x: f.l, y: f.t, width: f.r - f.l, height: f.b - f.t, fill: 'transparent' }, f.svg);
    f.svg.insertBefore(hov, Lh.gl);
    const cross = el('line', { x1: f.l, x2: f.r, stroke: css('--muted'), 'stroke-dasharray': '2 2', visibility: 'hidden' }, f.svg);
    hov.addEventListener('pointermove', (e) => {
      const p = pt(f, e), price = y.inv(p.y);
      cross.setAttribute('y1', p.y); cross.setAttribute('y2', p.y); cross.setAttribute('visibility', 'visible');
      if (p.x >= xSplit) {
        const b = o.bars.find((bb) => price >= bb.priceLow && price < bb.priceHigh);
        if (!b || !b.L) return hide(f);
        const share = o.yourL ? o.yourL / (b.L + o.yourL) : null;
        tip(f, o.simple
          ? `<b>$${b.priceLow.toFixed(0)}–$${b.priceHigh.toFixed(0)}</b><br>liquidity ${(b.L / o.activeL).toFixed(2)}× current` + (share ? `<br>your fee share ${(share * 100).toFixed(3)}%` : '')
          : `<b>${b.priceLow.toFixed(0)}–${b.priceHigh.toFixed(0)}</b><br>pool L ${b.L.toExponential(3)}<br>${(b.L / o.activeL * 100).toFixed(0)}% of active L` + (share ? `<br>your share here ${(share * 100).toFixed(4)}%` : ''), p.x, p.y);
      } else {
        const i = Math.floor(xs.inv(p.x));
        if (i >= 0 && i < nH) { const d = hist[i]; tip(f, `<b>${d.date}</b><br>O ${d.open.toFixed(2)} H ${d.high.toFixed(2)}<br>L ${d.low.toFixed(2)} C ${d.close.toFixed(2)}<br>vol $${kfmt(d.volumeUsd)}`, p.x, p.y); }
        else if (i >= nH && i < nH + nF) { const c2 = o.cone[i - nH]; tip(f, o.simple ? `<b>+${c2.day}d</b><br>90%: $${c2.p5.toFixed(0)} – $${c2.p95.toFixed(0)}<br>median $${c2.p50.toFixed(0)}` : `<b>day +${c2.day}</b> (model)<br>P95 ${c2.p95.toFixed(0)}<br>P50 ${c2.p50.toFixed(0)}<br>P5 ${c2.p5.toFixed(0)}`, p.x, p.y); }
        else hide(f);
      }
    });
    hov.addEventListener('pointerleave', () => { hide(f); cross.setAttribute('visibility', 'hidden'); });
  }

  function lineChart(c, { series, tipRow, xFmt = kfmt, yFmt = kfmt, shade, marker, xLabels }) {
    const f = frame(c, { l: 40, r: 6, t: 6, b: 16 });
    const X = series.flatMap((s) => s.values.map((v) => v.x)), Y = series.flatMap((s) => s.values.map((v) => v.y));
    const x0 = Math.min(...X), x1 = Math.max(...X); let y0 = Math.min(...Y), y1 = Math.max(...Y); const pd = (y1 - y0) * 0.08 || 1; y0 -= pd; y1 += pd;
    const x = lin(x0, x1, f.l, f.r), y = lin(y0, y1, f.b, f.t);
    for (const t of ticks(y0, y1, 4)) { el('line', { x1: f.l, x2: f.r, y1: y(t), y2: y(t), stroke: css('--rule') }, f.svg); el('text', { x: f.l - 4, y: y(t) + 3, 'text-anchor': 'end' }, f.svg).textContent = yFmt(t); }
    if (shade) el('rect', { x: x(Math.max(x0, shade[0])), width: Math.max(0, x(Math.min(x1, shade[1])) - x(Math.max(x0, shade[0]))), y: f.t, height: f.b - f.t, fill: css('--band') }, f.svg);
    (xLabels || ticks(x0, x1, 4).map((t) => [t, xFmt(t)])).forEach(([v, t]) => { el('text', { x: x(v), y: f.H - 3, 'text-anchor': 'middle' }, f.svg).textContent = t; });
    if (marker) el('line', { x1: x(marker), x2: x(marker), y1: f.t, y2: f.b, stroke: css('--muted'), 'stroke-dasharray': '2 2' }, f.svg);
    for (const s of series) el('path', { d: path(s.values.map((v) => [x(v.x), y(v.y)])), fill: 'none', stroke: s.color, 'stroke-width': 1.75, 'stroke-dasharray': s.dash }, f.svg);
    const cross = el('line', { y1: f.t, y2: f.b, stroke: css('--muted'), visibility: 'hidden' }, f.svg);
    const hit = el('rect', { x: f.l, y: f.t, width: f.r - f.l, height: f.b - f.t, fill: 'transparent' }, f.svg);
    hit.addEventListener('pointermove', (e) => {
      const p = pt(f, e), xv = x.inv(p.x), base = series[0].values;
      let i = 0, best = Infinity; base.forEach((v, j) => { const d = Math.abs(v.x - xv); if (d < best) { best = d; i = j; } });
      cross.setAttribute('x1', x(base[i].x)); cross.setAttribute('x2', x(base[i].x)); cross.setAttribute('visibility', 'visible');
      tip(f, tipRow(i), p.x, p.y);
    });
    hit.addEventListener('pointerleave', () => { hide(f); cross.setAttribute('visibility', 'hidden'); });
  }

  function histogram(c, { bins, fmt, total }) {
    const f = frame(c, { l: 30, r: 6, t: 6, b: 16 });
    const x = lin(bins[0].from, bins[bins.length - 1].to, f.l, f.r), maxC = Math.max(...bins.map((b) => b.count)), y = lin(0, maxC, f.b, f.t);
    for (const t of ticks(0, maxC, 3)) { el('line', { x1: f.l, x2: f.r, y1: y(t), y2: y(t), stroke: css('--rule') }, f.svg); el('text', { x: f.l - 3, y: y(t) + 3, 'text-anchor': 'end' }, f.svg).textContent = ((t / total) * 100).toFixed(0) + '%'; }
    ticks(bins[0].from, bins[bins.length - 1].to, 4).forEach((t) => { el('text', { x: x(t), y: f.H - 3, 'text-anchor': 'middle' }, f.svg).textContent = fmt(t); });
    if (bins[0].from < 0 && bins[bins.length - 1].to > 0) el('line', { x1: x(0), x2: x(0), y1: f.t, y2: f.b, stroke: css('--muted') }, f.svg);
    for (const b of bins) {
      const x0 = x(b.from) + 0.5, w = Math.max(1, x(b.to) - x(b.from) - 1), mid = (b.from + b.to) / 2;
      const r = el('rect', { x: x0, y: y(b.count), width: w, height: f.b - y(b.count), fill: mid < 0 ? css('--series-2') : css('--series-1') }, f.svg);
      const h = el('rect', { x: x0, y: f.t, width: w, height: f.b - f.t, fill: 'transparent' }, f.svg);
      h.addEventListener('pointermove', (e) => { const p = pt(f, e); r.setAttribute('opacity', 0.7); tip(f, `${fmt(b.from)} … ${fmt(b.to)}<br>${((b.count / total) * 100).toFixed(1)}% of paths`, p.x, p.y); });
      h.addEventListener('pointerleave', () => { r.removeAttribute('opacity'); hide(f); });
    }
  }

  window.Charts = { priceProfile, lineChart, histogram, kfmt };
})();

<script>
(function(){
"use strict";
// ---- engine/errors.js ----
// Typed error carried from engine/API to HTTP responses.
class ApiError extends Error {
  constructor(status, code, message, details) {
    super(message);
    this.name = 'ApiError';
    this.status = status;
    this.code = code;
    this.details = details;
  }
  toJSON() {
    return { error: { code: this.code, message: this.message, details: this.details } };
  }
}

const isApiError = (e) => e && e.name === 'ApiError' && typeof e.status === 'number';

// ---- engine/sha256.js ----
// Synchronous SHA-256 (pure JS) so hashing is identical in Node and the browser.
const SHA_K = new Uint32Array([
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
  0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
  0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
  0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
  0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
  0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
]);

function utf8Bytes(str) {
  if (typeof TextEncoder !== 'undefined') return new TextEncoder().encode(str);
  const out = [];
  for (const ch of unescape(encodeURIComponent(str))) out.push(ch.charCodeAt(0));
  return Uint8Array.from(out);
}

function sha256Hex(input) {
  const msg = typeof input === 'string' ? utf8Bytes(input) : input;
  const bitLen = msg.length * 8;
  const padLen = (((msg.length + 9 + 63) >> 6) << 6);
  const buf = new Uint8Array(padLen);
  buf.set(msg);
  buf[msg.length] = 0x80;
  const view = new DataView(buf.buffer);
  view.setUint32(padLen - 4, bitLen >>> 0);
  view.setUint32(padLen - 8, Math.floor(bitLen / 0x100000000));
  const H = new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]);
  const W = new Uint32Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < padLen; off += 64) {
    for (let i = 0; i < 16; i++) W[i] = view.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(W[i - 15], 7) ^ rotr(W[i - 15], 18) ^ (W[i - 15] >>> 3);
      const s1 = rotr(W[i - 2], 17) ^ rotr(W[i - 2], 19) ^ (W[i - 2] >>> 10);
      W[i] = (W[i - 16] + s0 + W[i - 7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + SHA_K[i] + W[i]) >>> 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
    H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }
  return Array.from(H, (x) => x.toString(16).padStart(8, '0')).join('');
}

// Canonical JSON: object keys sorted recursively, undefined dropped. Used for content hashes.
function canonicalJson(value) {
  if (value === null || typeof value !== 'object') {
    if (typeof value === 'number' && !Number.isFinite(value)) return 'null';
    return JSON.stringify(value);
  }
  if (Array.isArray(value)) return '[' + value.map((v) => (v === undefined ? 'null' : canonicalJson(v))).join(',') + ']';
  const keys = Object.keys(value).filter((k) => value[k] !== undefined).sort();
  return '{' + keys.map((k) => JSON.stringify(k) + ':' + canonicalJson(value[k])).join(',') + '}';
}

function contentHash(value) {
  return sha256Hex(canonicalJson(value));
}

// ---- engine/v3math.js ----
// Uniswap v3 concentrated-liquidity math in human units.
// Convention throughout: P = price of the base asset (WETH) in the quote asset (USDC).
//   x = base amount (WETH), y = quote amount (USDC), value V = x*P + y.
// For a position with liquidity L on [Pa, Pb]:
//   P <= Pa : x = L(1/sqrt(Pa) - 1/sqrt(Pb)), y = 0
//   Pa<P<Pb : x = L(1/sqrt(P)  - 1/sqrt(Pb)), y = L(sqrt(P) - sqrt(Pa))
//   P >= Pb : x = 0,                          y = L(sqrt(Pb) - sqrt(Pa))
// Human L converts to on-chain (raw) L by multiplying by sqrt(10^dec0 * 10^dec1).

const LOG_TICK = Math.log(1.0001);
const MIN_TICK = -887272;
const MAX_TICK = 887272;

/**
 * Pool tick -> human price of base in quote. `baseIsToken1` true when the base asset (WETH)
 * is token1 (true for the USDC/WETH mainnet pools, where token0 = USDC).
 */
function tickToPrice(tick, pool) {
  const { dec0, dec1, baseIsToken1 } = poolDecimals(pool);
  // raw price token1/token0 = 1.0001^tick; human token1 per token0 = raw * 10^(dec0-dec1)
  const t1PerT0 = Math.pow(1.0001, tick) * Math.pow(10, dec0 - dec1);
  return baseIsToken1 ? 1 / t1PerT0 : t1PerT0;
}

function priceToTick(price, pool) {
  assertPositive(price, 'price');
  const { dec0, dec1, baseIsToken1 } = poolDecimals(pool);
  const t1PerT0 = baseIsToken1 ? 1 / price : price;
  const raw = t1PerT0 / Math.pow(10, dec0 - dec1);
  return Math.log(raw) / LOG_TICK;
}

function poolDecimals(pool) {
  const dec0 = pool.token0.decimals;
  const dec1 = pool.token1.decimals;
  const baseIsToken1 = pool.base === 'token1';
  return { dec0, dec1, baseIsToken1 };
}

/** Snap a requested [lower, upper] price range to initializable ticks (nearest multiple of spacing). */
function alignRange(lower, upper, pool) {
  const s = pool.tickSpacing;
  const tA = priceToTick(lower, pool);
  const tB = priceToTick(upper, pool);
  let lo = Math.round(Math.min(tA, tB) / s) * s;
  let hi = Math.round(Math.max(tA, tB) / s) * s;
  lo = Math.max(lo, Math.ceil(MIN_TICK / s) * s);
  hi = Math.min(hi, Math.floor(MAX_TICK / s) * s);
  if (hi <= lo) {
    throw new ApiError(422, 'RANGE_TOO_NARROW',
      `Range ${lower}–${upper} collapses to a single tick at spacing ${s}; widen it.`, { tickLower: lo, tickUpper: hi });
  }
  const pAtLo = tickToPrice(lo, pool);
  const pAtHi = tickToPrice(hi, pool);
  return { tickLower: lo, tickUpper: hi, lower: Math.min(pAtLo, pAtHi), upper: Math.max(pAtLo, pAtHi) };
}

function amountsForLiquidity(L, P, Pa, Pb) {
  const sa = Math.sqrt(Pa), sb = Math.sqrt(Pb);
  if (P <= Pa) return { x: L * (1 / sa - 1 / sb), y: 0 };
  if (P >= Pb) return { x: 0, y: L * (sb - sa) };
  const s = Math.sqrt(P);
  return { x: L * (1 / s - 1 / sb), y: L * (s - sa) };
}

function positionValue(L, P, Pa, Pb) {
  const { x, y } = amountsForLiquidity(L, P, Pa, Pb);
  return x * P + y;
}

/** Liquidity bought by `capital` (in quote units) at price P for range [Pa, Pb], optimally split. */
function liquidityForCapital(capital, P, Pa, Pb) {
  assertPositive(capital, 'capital');
  assertPositive(P, 'price');
  if (!(Pa > 0 && Pb > Pa)) throw new ApiError(422, 'INVALID_RANGE', 'Require 0 < lower < upper.', { lower: Pa, upper: Pb });
  const sa = Math.sqrt(Pa), sb = Math.sqrt(Pb);
  if (P <= Pa) return capital / (P * (1 / sa - 1 / sb));
  if (P >= Pb) return capital / (sb - sa);
  const s = Math.sqrt(P);
  return capital / (2 * s - sa - P / sb);
}

/** Liquidity from explicit token amounts (min of the two constraints, as the NonfungiblePositionManager does). */
function liquidityForAmounts(x, y, P, Pa, Pb) {
  const sa = Math.sqrt(Pa), sb = Math.sqrt(Pb);
  if (P <= Pa) return x / (1 / sa - 1 / sb);
  if (P >= Pb) return y / (sb - sa);
  const s = Math.sqrt(P);
  return Math.min(x / (1 / s - 1 / sb), y / (s - sa));
}

/** Uniswap v2 / full-range liquidity for the same capital, for capital-efficiency comparisons. */
function fullRangeLiquidity(capital, P) {
  return capital / (2 * Math.sqrt(P));
}

function toRawLiquidity(Lhuman, pool) {
  return Lhuman * Math.sqrt(Math.pow(10, pool.token0.decimals) * Math.pow(10, pool.token1.decimals));
}

function fromRawLiquidity(Lraw, pool) {
  return Lraw / Math.sqrt(Math.pow(10, pool.token0.decimals) * Math.pow(10, pool.token1.decimals));
}

/**
 * Active liquidity implied by a depth quote: pushing `quoteIn` of the quote token into the pool moves
 * the average execution price `slippage` above spot. With L constant over the move, the average price
 * of the bought base equals sqrt(P0*P1), so sqrt(P1) = sqrt(P0)*(1+s) and quoteIn = L*sqrt(P0)*s.
 */
function liquidityFromDepth(quoteIn, slippage, P0) {
  assertPositive(quoteIn, 'quoteIn');
  assertPositive(slippage, 'slippage');
  assertPositive(P0, 'price');
  return quoteIn / (Math.sqrt(P0) * slippage);
}

/** Impermanent loss of an LP position vs holding its initial amounts, excluding fees. */
function impermanentLoss(L, P0, P1, Pa, Pb) {
  const a0 = amountsForLiquidity(L, P0, Pa, Pb);
  const hodl = a0.x * P1 + a0.y;
  const lp = positionValue(L, P1, Pa, Pb);
  return { lp, hodl, il: hodl > 0 ? lp / hodl - 1 : 0 };
}

function assertPositive(v, name) {
  if (!(typeof v === 'number' && Number.isFinite(v) && v > 0)) {
    throw new ApiError(422, 'INVALID_NUMBER', `${name} must be a positive finite number`, { [name]: v });
  }
}

// ---- engine/curve.js ----
// Liquidity curve: active liquidity at every price, rebuilt from on-chain initialized ticks.
//   state.liquidity = active L in the segment containing the current tick.
//   Crossing an initialized tick k upward:   L += liquidityNet[k]
//   Crossing it downward (k ≤ current tick): L -= liquidityNet[k]
// With base = token1 (WETH) and quote = token0 (USDC), a higher tick means a lower WETH price.


function buildSegments(state, ticks, pool) {
  const t0 = Number(state.tick);
  const L0 = BigInt(state.liquidity);
  const sorted = ticks.map((t) => ({ idx: Number(t.tickIdx), net: BigInt(t.liquidityNet) })).sort((a, b) => a.idx - b.idx);
  if (!sorted.length) throw new ApiError(422, 'NO_TICKS', 'Snapshot has no initialized ticks');
  const above = sorted.filter((t) => t.idx > t0);
  const below = sorted.filter((t) => t.idx <= t0).reverse();
  const lo = below.length ? below[0].idx : sorted[0].idx;
  const hi = above.length ? above[0].idx : sorted[sorted.length - 1].idx;
  const raw = [{ tickLower: lo, tickUpper: hi, L: L0, current: true }];
  let L = L0;
  for (let i = 0; i < above.length - 1; i++) { L += above[i].net; raw.push({ tickLower: above[i].idx, tickUpper: above[i + 1].idx, L }); }
  L = L0;
  for (let i = 0; i < below.length - 1; i++) { L -= below[i].net; raw.unshift({ tickLower: below[i + 1].idx, tickUpper: below[i].idx, L }); }
  const segs = raw.map((s) => {
    const pA = tickToPrice(s.tickLower, pool), pB = tickToPrice(s.tickUpper, pool);
    return { tickLower: s.tickLower, tickUpper: s.tickUpper, Lraw: s.L.toString(), L: fromRawLiquidity(Number(s.L), pool), priceLow: Math.min(pA, pB), priceHigh: Math.max(pA, pB), current: !!s.current, negative: s.L < 0n };
  });
  segs.sort((a, b) => a.priceLow - b.priceLow);
  return segs;
}

/** Fast lookup structure: L at any price (null outside the curve window). */
function makeCurve(segs) {
  const lows = Float64Array.from(segs.map((s) => s.priceLow));
  const Ls = Float64Array.from(segs.map((s) => s.L));
  const minP = segs[0].priceLow, maxP = segs[segs.length - 1].priceHigh;
  function at(p) {
    if (p < minP || p >= maxP) return null;
    let lo = 0, hi = lows.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (lows[mid] <= p) lo = mid; else hi = mid - 1; }
    return Ls[lo];
  }
  return { at, minP, maxP, segs };
}

/** Log-spaced bars for charting: tick-weighted average L in each bar. */
function liquidityBars(segs, center, halfWidthPct = 25, n = 100) {
  const lo = center * (1 - halfWidthPct / 100), hi = center * (1 + halfWidthPct / 100);
  const bars = [];
  for (let i = 0; i < n; i++) {
    const a = lo * Math.pow(hi / lo, i / n), b = lo * Math.pow(hi / lo, (i + 1) / n);
    let w = 0, acc = 0;
    for (const s of segs) {
      const x = Math.max(a, s.priceLow), y = Math.min(b, s.priceHigh);
      if (y > x) { const ww = Math.log(y / x); acc += s.L * ww; w += ww; }
    }
    bars.push({ priceLow: a, priceHigh: b, L: w > 0 ? acc / w : null });
  }
  return bars;
}

/** Tick-weighted average pool L across [a, b] (for "how crowded is my range"). */
function averageL(segs, a, b) {
  let w = 0, acc = 0;
  for (const s of segs) {
    const x = Math.max(a, s.priceLow), y = Math.min(b, s.priceHigh);
    if (y > x) { const ww = Math.log(y / x); acc += s.L * ww; w += ww; }
  }
  return { L: w > 0 ? acc / w : null, coverage: w / Math.log(b / a) };
}

// ---- engine/stats.js ----
// Small deterministic statistics toolkit.

/** mulberry32: fast, seedable 32-bit PRNG. Same seed => same stream in every JS engine. */
function makeRng(seed) {
  let a = (seed >>> 0) || 0x9e3779b9;
  return function next() {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Standard normal via Box-Muller (uses two uniforms per draw; deterministic). */
function makeNormal(rng) {
  return function normal() {
    let u = rng();
    if (u < 1e-12) u = 1e-12;
    const v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };
}

function logReturns(prices) {
  const out = [];
  for (let i = 1; i < prices.length; i++) out.push(Math.log(prices[i] / prices[i - 1]));
  return out;
}

function mean(xs) {
  if (!xs.length) return NaN;
  let s = 0;
  for (const x of xs) s += x;
  return s / xs.length;
}

/** Sample standard deviation (n-1). */
function stdev(xs) {
  if (xs.length < 2) return NaN;
  const m = mean(xs);
  let s = 0;
  for (const x of xs) s += (x - m) * (x - m);
  return Math.sqrt(s / (xs.length - 1));
}

/** Quantile with linear interpolation on a pre-sorted ascending array. */
function quantileSorted(sorted, q) {
  if (!sorted.length) return NaN;
  const pos = (sorted.length - 1) * q;
  const lo = Math.floor(pos), hi = Math.ceil(pos);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
}

function summarize(values) {
  const s = Float64Array.from(values).sort();
  return {
    mean: mean(s),
    p5: quantileSorted(s, 0.05),
    p25: quantileSorted(s, 0.25),
    p50: quantileSorted(s, 0.5),
    p75: quantileSorted(s, 0.75),
    p95: quantileSorted(s, 0.95),
    min: s[0],
    max: s[s.length - 1],
  };
}

function histogram(values, bins = 30) {
  let min = Infinity, max = -Infinity;
  for (const v of values) { if (v < min) min = v; if (v > max) max = v; }
  if (min === max) { min -= 1; max += 1; }
  const w = (max - min) / bins;
  const counts = new Array(bins).fill(0);
  for (const v of values) counts[Math.min(bins - 1, Math.floor((v - min) / w))]++;
  return counts.map((c, i) => ({ from: min + i * w, to: min + (i + 1) * w, count: c }));
}

function median(xs) {
  return quantileSorted(Float64Array.from(xs).sort(), 0.5);
}

// ---- engine/validate.js ----
// Input schema, defaults and validation for analysis requests. All problems are reported at once.

const INPUT_DEFAULTS = Object.freeze({
  horizonDays: 30,
  volumePolicy: '30d',
  volWindowDays: 90,
  liquidityMode: 'follow',
  driftAnnual: 0,
  gasUsd: 20,
  simulations: 2000,
  seed: 42,
  stepsPerDay: 4,
  compareWidthsPct: [1, 2, 5, 10, 15, 20, 30],
});

const INPUT_SCHEMA = {
  capitalUsd: { type: 'number', required: true, min: 1, max: 1e9, doc: 'Capital to deploy, in USD (USDC).' },
  rangeLower: { type: 'number', min: 1e-9, doc: 'Lower bound, USDC per WETH. Required unless rangeWidthPct is set.' },
  rangeUpper: { type: 'number', min: 1e-9, doc: 'Upper bound, USDC per WETH. Required unless rangeWidthPct is set.' },
  rangeWidthPct: { type: 'number', min: 0.1, max: 95, doc: 'Alternative to explicit bounds: symmetric ±% around the entry price.' },
  entryPrice: { type: 'number', min: 1e-9, doc: 'Entry price for what-if analysis. Defaults to the snapshot spot price.' },
  horizonDays: { type: 'integer', min: 1, max: 365, doc: 'Holding period for the forward simulation.' },
  volumePolicy: { type: 'string', pattern: /^(7d|30d|90d|median30d|24h)$/, doc: 'Daily volume basis: mean of last 7/30/90 complete days, median of last 30, or the latest 24h figure.' },
  volWindowDays: { type: 'integer', min: 7, max: 90, doc: 'Window (days) for realized volatility.' },
  liquidityMode: { type: 'string', pattern: /^(follow|static)$/, doc: "Headline fee model. 'follow': other LPs' crowding moves with price (pool L stays at today's active L). 'static': today's liquidity map stays put." },
  volumeUsdOverride: { type: 'number', min: 0, max: 1e12, doc: 'Daily pool volume, in USD, to assume instead of the observed values.' },
  volatilityOverride: { type: 'number', min: 0.01, max: 5, doc: 'Annualized volatility (0.6 = 60%).' },
  driftAnnual: { type: 'number', min: -5, max: 5, doc: 'Annualized drift of the price (expected return); 0 means no directional view.' },
  gasUsd: { type: 'number', min: 0, max: 1e6, doc: 'Total gas for mint, collect and burn, in USD.' },
  simulations: { type: 'integer', min: 100, max: 20000, doc: 'Number of Monte Carlo paths.' },
  seed: { type: 'integer', min: 0, max: 4294967295, doc: 'PRNG seed; the same seed gives identical results.' },
  stepsPerDay: { type: 'integer', min: 1, max: 48, doc: 'Simulation sub-steps per day; more steps detect range exits more accurately.' },
  compareWidthsPct: { type: 'array', items: { type: 'number', min: 0.1, max: 95 }, maxItems: 12, doc: 'Symmetric widths (±%) to compare against.' },
};

function checkScalar(name, v, spec, errs) {
  if (spec.type === 'number' || spec.type === 'integer') {
    if (typeof v !== 'number' || !Number.isFinite(v)) return errs.push({ field: name, message: 'must be a finite number' });
    if (spec.type === 'integer' && !Number.isInteger(v)) return errs.push({ field: name, message: 'must be an integer' });
    if (spec.min !== undefined && v < spec.min) return errs.push({ field: name, message: `must be ≥ ${spec.min}` });
    if (spec.max !== undefined && v > spec.max) return errs.push({ field: name, message: `must be ≤ ${spec.max}` });
  } else if (spec.type === 'string') {
    if (typeof v !== 'string') return errs.push({ field: name, message: 'must be a string' });
    if (spec.pattern && !spec.pattern.test(v)) return errs.push({ field: name, message: `has invalid format (${spec.pattern})` });
  }
  return null;
}

/** Validate raw inputs and fill defaults. Throws a 422 ApiError listing every problem. */
function normalizeInputs(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
    throw new ApiError(422, 'INVALID_INPUTS', 'inputs must be a JSON object', { problems: [{ field: 'inputs', message: 'not an object' }] });
  }
  const errs = [];
  const unknown = Object.keys(raw).filter((k) => !(k in INPUT_SCHEMA));
  for (const k of unknown) errs.push({ field: k, message: 'unknown field' });
  const out = { ...INPUT_DEFAULTS, compareWidthsPct: [...INPUT_DEFAULTS.compareWidthsPct] };
  for (const [name, spec] of Object.entries(INPUT_SCHEMA)) {
    const v = raw[name];
    if (v === undefined || v === null) {
      if (spec.required) errs.push({ field: name, message: 'is required' });
      continue;
    }
    if (spec.type === 'array') {
      if (!Array.isArray(v)) { errs.push({ field: name, message: 'must be an array' }); continue; }
      if (v.length > spec.maxItems) { errs.push({ field: name, message: `at most ${spec.maxItems} items` }); continue; }
      v.forEach((item, i) => checkScalar(`${name}[${i}]`, item, spec.items, errs));
      out[name] = [...v];
      continue;
    }
    checkScalar(name, v, spec, errs);
    out[name] = v;
  }
  const hasBounds = out.rangeLower !== undefined || out.rangeUpper !== undefined;
  if (hasBounds && out.rangeWidthPct !== undefined) errs.push({ field: 'rangeWidthPct', message: 'give either rangeLower/rangeUpper or rangeWidthPct, not both' });
  if (!hasBounds && out.rangeWidthPct === undefined) errs.push({ field: 'rangeLower', message: 'rangeLower and rangeUpper (or rangeWidthPct) are required' });
  if (hasBounds) {
    if (out.rangeLower === undefined) errs.push({ field: 'rangeLower', message: 'is required when rangeUpper is given' });
    if (out.rangeUpper === undefined) errs.push({ field: 'rangeUpper', message: 'is required when rangeLower is given' });
    if (out.rangeLower !== undefined && out.rangeUpper !== undefined && !(out.rangeUpper > out.rangeLower)) {
      errs.push({ field: 'rangeUpper', message: 'must be greater than rangeLower' });
    }
  }
  if (errs.length) throw new ApiError(422, 'INVALID_INPUTS', `Invalid inputs (${errs.length} problem${errs.length > 1 ? 's' : ''})`, { problems: errs });
  return out;
}

// ---- engine/snapshot.js ----
// Snapshot validation, content addressing, and derivation of market inputs with provenance.
// A snapshot is the raw capture written by scripts/fetch-snapshot.mjs (on-chain state + ticks via JSON-RPC,
// market + daily history via GeckoTerminal), sealed with a content hash.
// Provenance tags:
//   observed  – published by a named source at a stated time/block (copied, not modelled)
//   derived   – deterministic arithmetic on observed values (curve, means, realized volatility)
//   estimated – rests on a model assumption (fees, simulation)
//   assumed   – supplied by the user or a default with no data behind it





const SNAPSHOT_SCHEMA_VERSION = 1;

/** Pool metadata with `base` filled in: the WETH side is the base asset whose price is quoted in USDC. */
function normalizePool(pool) {
  if (pool.base === 'token0' || pool.base === 'token1') return pool;
  const base = /^W?ETH$/i.test(pool.token1?.symbol || '') ? 'token1' : 'token0';
  return { ...pool, base };
}

const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
const isPos = (v) => isNum(v) && v > 0;
const isIso = (v) => typeof v === 'string' && !Number.isNaN(Date.parse(v));
const isIntStr = (v, signed) => typeof v === 'string' && (signed ? /^-?\d+$/ : /^\d+$/).test(v);

function validateSnapshot(s) {
  const problems = [];
  const need = (cond, msg) => { if (!cond) problems.push(msg); };
  if (!s || typeof s !== 'object' || Array.isArray(s)) throw new ApiError(422, 'SNAPSHOT_INVALID', 'Snapshot must be a JSON object', { problems: ['not an object'] });
  need(s.schemaVersion === SNAPSHOT_SCHEMA_VERSION, `schemaVersion must be ${SNAPSHOT_SCHEMA_VERSION}`);
  need(isIso(s.capturedAt), 'capturedAt must be an ISO timestamp');
  const p = s.pool || {};
  need(typeof p.address === 'string' && /^0x[0-9a-fA-F]{40}$/.test(p.address), 'pool.address must be a 20-byte hex address');
  need(isPos(p.feeTier) && p.feeTier < 0.1, 'pool.feeTier must be a fraction such as 0.0005');
  need(Number.isInteger(p.tickSpacing) && p.tickSpacing > 0, 'pool.tickSpacing must be a positive integer');
  for (const t of ['token0', 'token1']) need(p[t] && Number.isInteger(p[t].decimals), `pool.${t}.decimals must be an integer`);
  const st = s.state || {};
  need(Number.isInteger(st.tick), 'state.tick must be an integer');
  need(isIntStr(st.liquidity) && BigInt(st.liquidity) > 0n, 'state.liquidity must be a positive integer string');
  need(isPos(st.price), 'state.price must be > 0');
  need(Number.isInteger(st.block) && st.block > 0, 'state.block must be a block number');
  need(Array.isArray(s.ticks) && s.ticks.length > 0, 'ticks must be a non-empty array');
  (s.ticks || []).forEach((t, i) => {
    if (i > 2000) return;
    need(Number.isInteger(Number(t.tickIdx)) && Number(t.tickIdx) % (p.tickSpacing || 1) === 0, `ticks[${i}].tickIdx must be a multiple of tickSpacing`);
    need(isIntStr(String(t.liquidityNet), true), `ticks[${i}].liquidityNet must be an integer string`);
  });
  const m = s.market || {};
  need(isPos(m.tvlUsd), 'market.tvlUsd must be > 0');
  need(isNum(m.volume24hUsd) && m.volume24hUsd >= 0, 'market.volume24hUsd must be ≥ 0');
  need(Array.isArray(s.history), 'history must be an array');
  let prev = '';
  (s.history || []).forEach((d, i) => {
    const ok = isPos(d.open) && isPos(d.high) && isPos(d.low) && isPos(d.close) && d.high >= d.low - 1e-9;
    need(ok, `history[${i}] needs positive open/high/low/close with high ≥ low`);
    need(isNum(d.volumeUsd) && d.volumeUsd >= 0, `history[${i}].volumeUsd must be ≥ 0`);
    need(typeof d.date === 'string' && d.date > prev, `history[${i}].date must be strictly increasing`);
    prev = d.date;
  });
  need(s.sources && s.sources.rpc && s.sources.geckoterminal, 'sources.rpc and sources.geckoterminal are required');
  if (problems.length) throw new ApiError(422, 'SNAPSHOT_INVALID', `Snapshot failed validation (${problems.length} problem${problems.length > 1 ? 's' : ''})`, { problems });
  return true;
}

function stripSeal(s) { const { id, contentHash: _h, label: _l, ...rest } = s; return rest; }

function sealSnapshot(s, label) {
  const body = stripSeal(s);
  validateSnapshot(body);
  const hash = contentHash(body);
  return { id: 'snap_' + hash.slice(0, 16), contentHash: hash, label: label || `WETH/USDC ${+(body.pool.feeTier * 100).toFixed(2)}% · block ${body.state.block} · ${body.capturedAt.slice(0, 16)}Z`, ...body };
}

function verifySnapshot(s) {
  if (!s || typeof s.contentHash !== 'string') throw new ApiError(422, 'SNAPSHOT_UNSEALED', 'Snapshot has no contentHash');
  const hash = contentHash(stripSeal(s));
  if (hash !== s.contentHash || s.id !== 'snap_' + hash.slice(0, 16)) {
    throw new ApiError(409, 'SNAPSHOT_HASH_MISMATCH', 'Snapshot contents do not match their recorded hash; refusing to analyse it.', { expected: s.contentHash, actual: hash });
  }

/** Daily candles excluding a partial day dated on the capture date. */
function completeDays(snap) {
  const day = snap.capturedAt.slice(0, 10);
  return (snap.history || []).filter((d) => d.date < day);
}

function realizedVol(days, window) {
  const sl = days.slice(-(window + 1));
  if (sl.length < 8) return null;
  const r = logReturns(sl.map((d) => d.close));
  const daily = stdev(r);
  return { daily, annual: daily * Math.sqrt(365), n: r.length, from: sl[0].date, to: sl[sl.length - 1].date };

function deriveMarket(snap, opts = {}) {

  const activeLiquidity = { value: fromRawLiquidity(Number(snap.state.liquidity), pool), raw: snap.state.liquidity, kind: 'observed', method: 'pool.liquidity() read on-chain', ...rpc };

  }

    { label: '90-day mean', value: meanVol(90)?.value }, { label: '30-day median', value: medianVol(30)?.value }, { label: '24h (GeckoTerminal)', value: snap.market.volume24hUsd },

  const windows = { d7: realizedVol(days, 7), d30: realizedVol(days, 30), d90: realizedVol(days, 90) };

    pool,

    tvl: { value: snap.market.tvlUsd, kind: 'observed', method: 'GeckoTerminal reserve_in_usd', ...gt },
    history: { days: days.length, from: days[0]?.date, to: days[days.length - 1]?.date, ...gt },
    warnings,

}

// ---- engine/analysis.js ----
// Position analysis on a sealed snapshot: deposit, payoff, curve-aware fee estimates, Monte Carlo,
// rolling historical time-in-range, width comparison and a historical replay.







const ENGINE_VERSION = '2.1.0';

const ASSUMPTIONS = [
  { id: 'A1', text: "Fee share at price P = your L ÷ (pool L(P) + your L). 'follow' keeps pool L at today's active L wherever price goes (LPs re-centre); 'static' reads pool L(P) from today's on-chain liquidity map." },
  { id: 'A2', text: 'Pool volume per day stays at the selected level (default: 30-day mean). Real volume rises with volatility and is bursty.' },
  { id: 'A3', text: 'Forward prices follow driftless geometric Brownian motion at realized volatility. Real ETH returns have fat tails, so extremes are understated.' },
  { id: 'A4', text: 'Fees accrue at 0.05% of volume while in range; no compounding; protocol fee off.' },
  { id: 'A5', text: 'Historical figures use GeckoTerminal daily candles; time in range per day assumes prices are spread evenly between low and high.' },
  { id: 'A6', text: 'Gas is a flat USD cost for mint, collect and burn. No rebalancing.' },
  { id: 'A7', text: 'Competition is the liquidity visible at the snapshot block. Just-in-time liquidity (added and removed around single swaps) is not visible, so fee share is overstated, most of all in thin pools.' },

function roundDeep(v) {
  if (typeof v === 'number') return Number.isFinite(v) ? (v === 0 ? 0 : Number(v.toPrecision(12))) : null;
  if (Array.isArray(v)) return v.map(roundDeep);
  if (v && typeof v === 'object') { const o = {}; for (const k of Object.keys(v)) o[k] = roundDeep(v[k]); return o; }
  return v;
}

function candleTimeInRange(c, Pa, Pb) {
  if (c.high <= c.low) return c.close >= Pa && c.close <= Pb ? 1 : 0;
  return Math.max(0, Math.min(1, (Math.min(c.high, Pb) - Math.max(c.low, Pa)) / (c.high - c.low)));
}

function buildPosition(capital, P, range, poolL0, pool) {
  const L = liquidityForCapital(capital, P, range.lower, range.upper);
  const { x, y } = amountsForLiquidity(L, P, range.lower, range.upper);
  return { L, x, y, shareNow: L / (poolL0 + L), rawL: toRawLiquidity(L, pool), efficiency: L / fullRangeLiquidity(capital, P) };

function simulatePaths({ P0, sigma, mu, days, stepsPerDay, n, seed }) {
  const steps = days * stepsPerDay, dt = 1 / (365 * stepsPerDay);

/** Pool L along every path from today's map (static mode). Outside the map, fall back to today's active L. */
function poolLAlongPaths(sim, curve, L0) {
  const out = new Float64Array(sim.paths.length);
  let outside = 0;
  for (let k = 0; k < sim.paths.length; k++) { const v = curve.at(sim.paths[k]); if (v === null || v <= 0) { out[k] = L0; outside++; } else out[k] = v; }

function evaluateOnPaths(sim, ctx, range, detail = false) {

      else if (fe < 0) fe = s;
    }
    const PT = paths[b + steps - 1];
    const lp = positionValue(pos.L, PT, range.lower, range.upper), hodl = pos.x * PT + pos.y;
    const fFollow = feeFollowStep * inSteps;
    const fees = mode === 'static' ? fStatic : fFollow;
    const total = lp + fees - gasUsd;
    net[i] = total - capital; vsHodl[i] = total - hodl; fHead[i] = fees; fS[i] = fStatic; fF[i] = fFollow; tir[i] = inSteps / steps; il[i] = lp / hodl - 1;
    inStepsTot += inSteps; staticFeeInTot += fStatic;

    follow: feeFollowStep * stepsPerDay,

  };

    position: pos,
    dailyFeesInRange: dailyInRange,

    meanTimeInRange: summarize(tir).mean,

    out.endPrice = summarize(ends);

/** Same ±% range re-centred at each past start day's open and held H days. */
function rollingTimeInRange(days, ratioLow, ratioHigh, H) {
  const hold = Math.min(H, days.length - 1);
  if (hold < 2) return null;
  const res = [];
  for (let s = 0; s + hold <= days.length; s++) {
    const Pa = days[s].open * ratioLow, Pb = days[s].open * ratioHigh;
    let t = 0;
    for (let d = s; d < s + hold; d++) t += candleTimeInRange(days[d], Pa, Pb);
    res.push(t / hold);
  }
  const sorted = [...res].sort((a, b) => a - b);
  return { windows: res.length, holdDays: hold, mean: res.reduce((a, b) => a + b, 0) / res.length, p10: sorted[Math.floor(0.1 * (sorted.length - 1))], median: sorted[Math.floor(0.5 * (sorted.length - 1))] };
}

/** Replay: range set at the open of the first of the last N complete days, held to the end; observed daily volume. */
function replay({ days, n, capital, ratioLow, ratioHigh, L0, curveAtShift, fee, gasUsd, pool, mode }) {
  const sl = days.slice(-n);
  if (sl.length < 2) return null;
  const P0 = sl[0].open;
  const range = alignRange(P0 * ratioLow, P0 * ratioHigh, pool);
  const pos = buildPosition(capital, P0, range, L0, pool);
  let fees = 0, inR = 0;
  const series = [];
  for (const d of sl) {
    const f = candleTimeInRange(d, range.lower, range.upper);
    // pool L near the day's price: follow = today's active L; static = today's map shifted so it is centred on P0
    const Lp = mode === 'static' ? (curveAtShift(d.close / P0) ?? L0) : L0;
    fees += d.volumeUsd * fee * (pos.L / (Lp + pos.L)) * f;
    inR += f;
    const lp = positionValue(pos.L, d.close, range.lower, range.upper), hodl = pos.x * d.close + pos.y;
    series.push({ t: d.date, close: d.close, low: d.low, high: d.high, volumeUsd: d.volumeUsd, lp, hodl, fees, timeInRange: f });
  }
  const last = series[series.length - 1];
  return {
    kind: 'mixed', from: sl[0].date, to: last.t, days: sl.length, entryPrice: P0, range: { lower: range.lower, upper: range.upper },
    timeInRangePct: inR / sl.length, feesUsd: fees, lpValueEnd: last.lp, hodlValueEnd: last.hodl,

function valueCurve(L, x0, y0, P0, range) {
  const lo = Math.min(P0, range.lower) * 0.75, hi = Math.max(P0, range.upper) * 1.25;
  const pts = [];
  for (let i = 0; i <= 100; i++) { const p = lo * Math.pow(hi / lo, i / 100); const lp = positionValue(L, p, range.lower, range.upper), hodl = x0 * p + y0; pts.push({ price: p, lp, hodl, ilPct: lp / hodl - 1 }); }

}

/**
 * Daily pool volume at which the expected result vs holding is zero. Fees scale linearly with volume and
 * nothing else in the result depends on it, so: vsHold(V) = fees·V/V0 + rest  →  V* = V0 · (−rest) / fees.
 */
function breakEvenVolume(volume0, expectedFees, expectedVsHodl) {
  const rest = expectedVsHodl - expectedFees;          // price effect − gas (volume-independent)
  if (rest >= 0) return { volumeUsd: 0, multiple: 0, note: 'beats holding even with zero fees' };
  if (!(expectedFees > 0)) return { volumeUsd: null, multiple: null, note: 'no fees earned on these paths' };
  const v = volume0 * (-rest) / expectedFees;
  return { volumeUsd: v, multiple: v / volume0 };
}

/** ETH exposure (WETH held, in USD and % of position value) at a given price. */
function exposureAt(L, P, range) {
  const { x, y } = amountsForLiquidity(L, P, range.lower, range.upper);
  const value = x * P + y;
  return { price: P, weth: x, usd: x * P, pctOfPosition: value > 0 ? (x * P) / value : 0 };
}

/** Fraction of a steady (log-linear) move from P0 to P1 that stays inside [a, b]. */
function linearTimeInRange(P0, P1, a, b) {
  const l0 = Math.log(P0), l1 = Math.log(P1), la = Math.log(a), lb = Math.log(b);
  if (Math.abs(l1 - l0) < 1e-12) return P0 >= a && P0 <= b ? 1 : 0;
  const t = (l) => (l - l0) / (l1 - l0);
  const lo = Math.max(0, Math.min(t(la), t(lb))), hi = Math.min(1, Math.max(t(la), t(lb)));
  return Math.max(0, hi - lo);
}

/** "If ETH moves steadily to X% over the horizon": deterministic what-ifs for the presenter. */
function priceScenarios({ moves, P0, pos, range, dailyFees, H, gasUsd, capital }) {
  return moves.map((m) => {
    const P1 = P0 * (1 + m);
    const tir = linearTimeInRange(P0, P1, range.lower, range.upper);
    const fees = dailyFees * H * tir;
    const lp = positionValue(pos.L, P1, range.lower, range.upper), hodl = pos.x * P1 + pos.y;
    return { move: m, price: P1, timeInRange: tir, fees, lpValue: lp, hodlValue: hodl, netPnl: lp + fees - gasUsd - capital, vsHodl: lp + fees - gasUsd - hodl };
  });
}

function analyze(snapshot, rawInputs) {
  verifySnapshot(snapshot);
  const inputs = normalizeInputs(rawInputs);
  const market = deriveMarket(snapshot, inputs);
  const pool = normalizePool(snapshot.pool), fee = pool.feeTier;
  const warnings = [...market.warnings];
  const curve = makeCurve(market.segs);
  const L0 = market.activeLiquidity.value;
  const spot = market.spot.value;
  const P0 = inputs.entryPrice ?? spot;
  if (inputs.entryPrice !== undefined) warnings.push({ code: 'WHAT_IF_ENTRY', message: `What-if entry at ${P0.toFixed(2)}: the liquidity map is still today's, observed at ${spot.toFixed(2)}.` });
  const reqLower = inputs.rangeWidthPct !== undefined ? P0 * (1 - inputs.rangeWidthPct / 100) : inputs.rangeLower;
  const reqUpper = inputs.rangeWidthPct !== undefined ? P0 * (1 + inputs.rangeWidthPct / 100) : inputs.rangeUpper;

  if (crowd.coverage < 0.999) warnings.push({ code: 'CURVE_PARTIAL', message: `Liquidity map covers ${(crowd.coverage * 100).toFixed(0)}% of this range; outside it, static mode uses today's active L.` });

  const sim = simulatePaths({ P0, sigma, mu: inputs.driftAnnual, days: inputs.horizonDays, stepsPerDay: inputs.stepsPerDay, n: inputs.simulations, seed: inputs.seed });
  const { Lstatic, outsideFraction } = poolLAlongPaths(sim, curve, L0);

  const rolling = rollingTimeInRange(days, ratioLow, ratioHigh, inputs.horizonDays);

  const daily = mode === 'static' ? (main.dailyFeesInRange.static ?? main.dailyFeesInRange.follow) : main.dailyFeesInRange.follow;

    const ev = evaluateOnPaths(sim, ctx, r);
    const roll = rollingTimeInRange(days, r.lower / P0, r.upper / P0, inputs.horizonDays);
    const lp = (P) => positionValue(ev.position.L, P, r.lower, r.upper), hodl = (P) => ev.position.x * P + ev.position.y;
    return row(w, r, ev, roll, capital, inputs.horizonDays, mode, { atLower: lp(r.lower) - hodl(r.lower), atUpper: lp(r.upper) - hodl(r.upper) }, volume);

  const result = roundDeep({
    engineVersion: ENGINE_VERSION,
    snapshot: { id: snapshot.id, contentHash: snapshot.contentHash, capturedAt: snapshot.capturedAt, label: snapshot.label, block: snapshot.state.block },
    inputs,
    market: {
      feeTier: market.feeTier, spot: market.spot, activeLiquidity: market.activeLiquidity, tvl: market.tvl, volume: market.volume, volatility: market.volatility, curve: market.curve, history: market.history,
    },
    liquidity: {
      kind: 'derived',
      bars: liquidityBars(market.segs, P0, 25, 100),
      inRangeAvgL: crowd.L, coverage: crowd.coverage, activeL: L0,
      crowdingVsActive: crowd.L ? crowd.L / L0 : null,
    },
    position: {
      kind: 'derived', entryPrice: inputs.entryPrice !== undefined ? { value: P0, kind: 'assumed' } : { value: P0, kind: 'observed', source: 'rpc' },
      requestedRange: { lower: reqLower, upper: reqUpper }, range, status,
      liquidity: pos.L, liquidityRaw: pos.rawL, amounts: { weth: pos.x, usdc: pos.y },
      composition: { wethPct: (pos.x * P0) / capital, usdcPct: pos.y / capital },

    breakEven: { kind: 'estimated', basis: `${mode} fees, expected result vs holding`, currentVolumeUsd: volume, ...breakEvenVolume(volume, main.fees.mean, main.vsHodl.mean) },
    exposure: { kind: 'derived', now: exposureAt(pos.L, P0, range), atLower: exposureAt(pos.L, range.lower, range), atUpper: exposureAt(pos.L, range.upper, range) },

    comparison: { kind: 'estimated', basis: 'same simulated paths for every row; history column re-centres each range on every past day', rows: [selected, ...comparison] },

function row(w, r, ev, roll, capital, H, mode, ilAt, volume) {
  const d = mode === 'static' ? (ev.dailyFeesInRange.static ?? ev.dailyFeesInRange.follow) : ev.dailyFeesInRange.follow;

    expectedFees: ev.fees.mean, expectedFeeApr: (ev.fees.mean / H) * 365 / capital,

    expectedNetPnl: ev.netPnl.mean, p5NetPnl: ev.netPnl.p5, medianNetPnl: ev.netPnl.p50,

function analysisId(snapshotId, normalizedInputs) {
