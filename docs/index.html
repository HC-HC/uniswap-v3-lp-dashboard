// ---- engine/tiers.js ----
// Fee-tier comparison: the same price range, analysed in each WETH/USDC pool (1, 5, 30, 100 bp).
// Each pool uses its OWN on-chain liquidity map, its own volume history and its own tick grid.
// For a fair comparison every pool shares the base pool's volatility and the same seed, so the
// simulated price paths are (near-)identical; only pool-specific economics differ.




const pairKey = (s) => `${s.pool.chain}:${s.pool.token0.symbol}/${s.pool.token1.symbol}`;

function compareTiers(base, others, rawInputs) {
  const inputs = normalizeInputs(rawInputs);
  const all = [base, ...others.filter((o) => o.id !== base.id)];
  const key = pairKey(base);
  for (const s of all) if (pairKey(s) !== key) throw new ApiError(422, 'TIER_PAIR_MISMATCH', `Snapshot ${s.id} is ${pairKey(s)}, not ${key}`);
  const seen = new Set();
  for (const s of all) {
    if (seen.has(s.pool.feeTier)) throw new ApiError(422, 'TIER_DUPLICATE', `Two snapshots for the ${s.pool.feeTier * 100}% tier; pass one per tier`);
    seen.add(s.pool.feeTier);
  }

  const { result: b } = analyze(base, { ...rawInputs, compareWidthsPct: [] });
  const sigma = b.market.volatility.annual;
  const lower = b.position.requestedRange.lower, upper = b.position.requestedRange.upper;
  const shared = { ...rawInputs, compareWidthsPct: [], rangeLower: lower, rangeUpper: upper, volatilityOverride: inputs.volatilityOverride ?? sigma };
  delete shared.rangeWidthPct;
  delete shared.entryPrice;

  const warnings = [];
  const times = all.map((s) => Date.parse(s.capturedAt));
  const spreadH = (Math.max(...times) - Math.min(...times)) / 3600000;
  if (spreadH > 1) warnings.push({ code: 'TIER_SNAPSHOTS_NOT_SIMULTANEOUS', message: `Tier snapshots were captured up to ${spreadH.toFixed(1)}h apart; prices and liquidity may have moved between them.` });

  const rows = all.map((s) => {
    const { result: r } = analyze(s, shared);
    const mode = r.inputs.liquidityMode;
    const alts = Object.fromEntries((r.market.volume.alternatives || []).map((a) => [a.label, a.value]));
    const vMed = alts['30-day median'], vUsed = r.market.volume.value;
    const feesAtMedian = vMed && vUsed ? r.fees.expected[mode] * vMed / vUsed : null;
    if (r.position.status !== 'in-range') warnings.push({ code: 'TIER_OUT_OF_RANGE', message: `${s.pool.feeTier * 100}% pool: range is ${r.position.status} at this pool's price.` });
    return {
      tierBp: Math.round(s.pool.feeTier * 1e4), feeTier: s.pool.feeTier, tickSpacing: s.pool.tickSpacing,
      address: s.pool.address, snapshotId: s.id, block: s.state.block, capturedAt: s.capturedAt,
      spot: r.market.spot.value, tvlUsd: r.market.tvl.value, volumeUsd: r.market.volume.value,
      poolFeesPerDay: r.fees.poolDailyFeesUsd, poolFeeAprOnTvl: r.fees.poolFeeAprOnTvl,
      activeL: r.market.activeLiquidity.value,
      range: { lower: r.position.range.lower, upper: r.position.range.upper, tickLower: r.position.range.tickLower, tickUpper: r.position.range.tickUpper },
      shareNow: r.position.shareNow,
      dailyFeesInRange: r.fees.dailyInRange[mode] ?? r.fees.dailyInRange.follow,
      expectedFees: r.fees.expected[mode], expectedFeeApr: r.fees.expectedApr[mode],
      timeInRange: r.simulation.meanTimeInRange,
      edgeLoss: Math.min(r.risk.atLower.ilUsd, r.risk.atUpper.ilUsd),
      netVsHold: r.simulation.vsHodl.mean, probBeatHodl: r.simulation.probBeatHodl,
      breakEvenVolumeUsd: r.breakEven.volumeUsd, breakEvenMultiple: r.breakEven.multiple,
      volumeMedian30: vMed ?? null, volumeLumpiness: vMed ? vUsed / vMed : null,
      expectedFeesAtMedianVolume: feesAtMedian, netVsHoldAtMedianVolume: feesAtMedian === null ? null : r.simulation.vsHodl.mean - r.fees.expected[mode] + feesAtMedian,
      feesPerActiveLPerDay: r.fees.poolDailyFeesUsd / r.market.activeLiquidity.value,
      base: s.id === base.id,
    };
  }).sort((x, y) => x.feeTier - y.feeTier);

  const baseRow = rows.find((r) => r.base);
  for (const r of rows) {
    if (r.base) continue;
    if (r.volumeLumpiness > 1.5) warnings.push({ code: 'TIER_LUMPY_VOLUME', message: `${r.feeTier * 100}% pool: volume is lumpy (mean ${r.volumeLumpiness.toFixed(1)}× the median); see the median-volume result.` });
    if (r.netVsHold > 0 && baseRow.netVsHold <= 0) warnings.push({ code: 'TIER_TOO_GOOD', message: `${r.feeTier * 100}% pool looks better than ${baseRow.feeTier * 100}% because its active liquidity is ${(baseRow.activeL / r.activeL).toFixed(0)}× thinner. Treat with caution: one snapshot can't see just-in-time liquidity bots add around big swaps, and thin pools can attract new LPs quickly.` });
  }

  const result = roundDeep({
    engineVersion: ENGINE_VERSION, kind: 'estimated',
    basis: `same price range ($${lower.toFixed(2)}–$${upper.toFixed(2)}), snapped to each pool's tick grid; each pool's own liquidity map and ${inputs.volumePolicy} volume; shared volatility ${(sigma * 100).toFixed(1)}% and seed ${inputs.seed}`,
    inputs, baseSnapshotId: base.id, sharedVolatility: sigma, rows, warnings,
  });
  return { result, resultHash: contentHash(result) };
}

// ---- api/openapi.js ----
// Minimal OpenAPI 3.1 description of the API, generated from the input schema.


function buildOpenApi() {
  const props = {};
  for (const [k, v] of Object.entries(INPUT_SCHEMA)) {
    props[k] = v.type === 'array'
      ? { type: 'array', items: { type: 'number', minimum: v.items.min, maximum: v.items.max }, maxItems: v.maxItems, description: v.doc, default: INPUT_DEFAULTS[k] }
      : { type: v.type, minimum: v.min, maximum: v.max, pattern: v.pattern ? v.pattern.source : undefined, description: v.doc, default: INPUT_DEFAULTS[k] };
  }
  const err = { description: 'Error', content: { 'application/json': { schema: { $ref: '#/components/schemas/Error' } } } };
  const body = (ref) => ({ required: true, content: { 'application/json': { schema: { $ref: ref } } } });
  const ok = (d) => ({ description: d, content: { 'application/json': {} } });
  const idParam = (name) => ({ name, in: 'path', required: true, schema: { type: 'string' } });
  return {
    openapi: '3.1.0',
    info: { title: 'Uniswap v3 LP Dashboard API', version: ENGINE_VERSION, description: 'Uniswap v3 WETH/USDC range analysis on content-addressed data snapshots. Every output field is tagged observed | derived | estimated | assumed.' },
    paths: {
      '/api/health': { get: { summary: 'Liveness and capabilities', responses: { 200: ok('ok') } } },
      '/api/schema': { get: { summary: 'Input schema, defaults, assumptions, provenance legend', responses: { 200: ok('schema') } } },
      '/api/snapshots': {
        get: { summary: 'List snapshots (newest first)', responses: { 200: ok('list') } },
        post: { summary: 'Import a raw snapshot; it is validated and content-addressed', requestBody: body('#/components/schemas/RawSnapshot'), responses: { 200: ok('already present'), 201: ok('created'), 422: err } },
      },
      '/api/snapshots/refresh': { post: { summary: 'Fetch live data (GeckoTerminal + optional RPC) into a new snapshot', responses: { 201: ok('created'), 502: err, 503: err } } },
      '/api/snapshots/{id}': { get: { summary: "Full snapshot ('latest' allowed)", parameters: [idParam('id')], responses: { 200: ok('snapshot'), 404: err, 409: err } } },
      '/api/snapshots/{id}/market': { get: { summary: 'Derived market inputs with provenance', parameters: [idParam('id'), { name: 'volumePolicy', in: 'query', schema: { type: 'string' } }], responses: { 200: ok('market') } } },
      '/api/analyze': { post: { summary: 'Run an analysis without saving it', requestBody: body('#/components/schemas/AnalyzeRequest'), responses: { 200: ok('report'), 404: err, 422: err } } },
      '/api/tiers': { post: { summary: 'Compare fee tiers: the same range analysed in each WETH/USDC pool (newest snapshot per tier, or compareSnapshotIds)', requestBody: body('#/components/schemas/AnalyzeRequest'), responses: { 200: ok('tier comparison'), 404: err, 422: err } } },
      '/api/analyses': {
        get: { summary: 'List saved analyses', responses: { 200: ok('list') } },
        post: { summary: 'Run and save an analysis. The id is determined by (snapshot, inputs, engine version), so saving twice returns the same id.', requestBody: body('#/components/schemas/AnalyzeRequest'), responses: { 200: ok('existing'), 201: ok('created'), 422: err } },
      },
      '/api/analyses/{id}': { get: { summary: 'Saved analysis with result', parameters: [idParam('id')], responses: { 200: ok('analysis'), 404: err } } },
      '/api/analyses/{id}/replay': { post: { summary: 'Recompute from the stored snapshot and inputs and compare result hashes', parameters: [idParam('id')], responses: { 200: ok('replay'), 404: err, 409: err } } },
      '/api/analyses/{id}/bundle': { get: { summary: 'Portable bundle (inputs + snapshot) for reproducing elsewhere', parameters: [idParam('id')], responses: { 200: ok('bundle') } } },
      '/api/bundles/import': { post: { summary: 'Import a bundle, verify hashes, and replay it', responses: { 200: ok('replay'), 409: err, 422: err } } },
    },
    components: {
      schemas: {
        Inputs: { type: 'object', required: ['capitalUsd'], additionalProperties: false, properties: props },
        AnalyzeRequest: { type: 'object', properties: { snapshotId: { type: 'string', description: "snapshot id or 'latest'" }, inputs: { $ref: '#/components/schemas/Inputs' }, label: { type: 'string' } }, required: ['inputs'] },
        RawSnapshot: { type: 'object', description: 'See data/raw/*.json for the format' },
        Error: { type: 'object', properties: { error: { type: 'object', properties: { code: { type: 'string' }, message: { type: 'string' }, details: {} } } } },
      },
    },
  };
}

// ---- api/memory-storage.js ----
// Browser-safe in-memory storage (used by tests and the hosted build).
class MemoryStorage {
  constructor({ snapshots = [], analyses = [] } = {}) {
    this.s = new Map(snapshots.map((x) => [x.id, structuredClone(x)]));
    this.a = new Map(analyses.map((x) => [x.id, structuredClone(x)]));
  }
  getSnapshot(id) { return this.s.has(id) ? structuredClone(this.s.get(id)) : null; }
  putSnapshot(x) { this.s.set(x.id, structuredClone(x)); }
  listSnapshots() { return [...this.s.values()]; }
  getAnalysis(id) { return this.a.has(id) ? structuredClone(this.a.get(id)) : null; }
  putAnalysis(x) { this.a.set(x.id, structuredClone(x)); }
  listAnalyses() { return [...this.a.values()]; }
}

// ---- api/router.js ----
// Transport-agnostic API router. The Node server and the hosted (in-browser) build both use it,
// so the HTTP API and the hosted page run the same code.
//   handle({ method, path, query, body }) -> { status, body, headers? }







const DEFAULT_POOL = '0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640'; // WETH/USDC 0.05%

const json = (status, body, headers) => ({ status, body, headers });

function snapshotSummary(s) {
  return {
    id: s.id,
    label: s.label,
    capturedAt: s.capturedAt,
    contentHash: s.contentHash,
    block: s.state?.block,
    price: s.state?.price,
    pool: { address: s.pool.address, feeTier: s.pool.feeTier, pair: `${s.pool.token1.symbol}/${s.pool.token0.symbol}` },
    sources: Object.fromEntries(Object.entries(s.sources || {}).map(([k, v]) => [k, { name: v.name, url: v.url }])),
    ticks: s.ticks?.length || 0,
    historyDays: s.history?.length || 0,
  };
}

function analysisSummary(a) {
  return {
    id: a.id, label: a.label, createdAt: a.createdAt, snapshotId: a.snapshotId, engineVersion: a.engineVersion,
    resultHash: a.resultHash,
    capitalUsd: a.inputs.capitalUsd, range: a.result?.position?.range,
    mode: a.inputs.liquidityMode, expectedFeeApr: a.result?.fees?.expectedApr?.[a.inputs.liquidityMode], expectedNetPnl: a.result?.simulation?.netPnl?.mean,
  };
}

function createRouter({ storage, liveProvider = null, now = () => new Date(), mode = 'server' }) {
  const byNewest = (a, b) => (a.capturedAt < b.capturedAt ? 1 : -1);
  /** Newest snapshot of a pool (default: the 0.05% pool; falls back to any pool). */
  const latestSnapshot = (pool = DEFAULT_POOL) => {
    const all = storage.listSnapshots().sort(byNewest);
    return all.find((s) => s.pool.address.toLowerCase() === pool.toLowerCase()) || all[0] || null;
  };
  /** Newest snapshot of every pool with the same token pair as `base`. */
  const latestPerTier = (base) => {
    const out = new Map();
    for (const s of storage.listSnapshots().sort(byNewest)) {
      if (s.pool.token0.symbol !== base.pool.token0.symbol || s.pool.token1.symbol !== base.pool.token1.symbol) continue;
      if (s.pool.address.toLowerCase() === base.pool.address.toLowerCase()) continue;
      if (!out.has(s.pool.feeTier)) out.set(s.pool.feeTier, s);
    }
    return [...out.values()];
  };
  const loadSnapshot = (id) => {
    const s = !id || id === 'latest' ? latestSnapshot() : storage.getSnapshot(id);
    if (!s) throw new ApiError(404, 'SNAPSHOT_NOT_FOUND', `No snapshot '${id || 'latest'}'`, { available: storage.listSnapshots().map((x) => x.id) });
    verifySnapshot(s);
    return s;
  };
  const requireBody = (body) => {
    if (body === undefined || body === null || typeof body !== 'object' || Array.isArray(body)) {
      throw new ApiError(400, 'BAD_REQUEST', 'Request body must be a JSON object');
    }
    return body;
  };

  const record = (snap, inputs, label) => {
    const { result, resultHash } = analyze(snap, inputs);
    const id = analysisId(snap.id, result.inputs);
    return { id, label: label || null, createdAt: now().toISOString(), engineVersion: ENGINE_VERSION, snapshotId: snap.id, snapshotContentHash: snap.contentHash, inputs: result.inputs, resultHash, result };
  };

  const replay = (rec) => {
    const snap = loadSnapshot(rec.snapshotId);
    if (snap.contentHash !== rec.snapshotContentHash) {
      throw new ApiError(409, 'SNAPSHOT_HASH_MISMATCH', 'Stored snapshot differs from the one this analysis was run on', { expected: rec.snapshotContentHash, actual: snap.contentHash });
    }
    const { resultHash, result } = analyze(snap, rec.inputs);
    return {
      id: rec.id,
      reproducible: resultHash === rec.resultHash,
      storedResultHash: rec.resultHash,
      recomputedResultHash: resultHash,
      storedEngineVersion: rec.engineVersion,
      currentEngineVersion: ENGINE_VERSION,
      snapshotId: snap.id,
      ...(resultHash === rec.resultHash ? {} : { note: rec.engineVersion !== ENGINE_VERSION ? 'Engine version changed since this analysis was saved.' : 'Same engine and snapshot but a different result: the runtime’s floating-point behaviour differs.' }),
      result,
    };
  };

  const routes = [
    ['GET', /^\/api\/health$/, () => json(200, { ok: true, engineVersion: ENGINE_VERSION, mode, snapshots: storage.listSnapshots().length, liveRefresh: !!liveProvider, time: now().toISOString() })],
    ['GET', /^\/api\/openapi\.json$/, () => json(200, buildOpenApi())],
    ['GET', /^\/api\/schema$/, () => json(200, {
      inputs: Object.fromEntries(Object.entries(INPUT_SCHEMA).map(([k, v]) => [k, { ...v, pattern: v.pattern ? String(v.pattern) : undefined, default: INPUT_DEFAULTS[k] }])),
      assumptions: ASSUMPTIONS,
      provenanceKinds: {
        observed: 'Value as published by a named source at a stated time',
        derived: 'Deterministic arithmetic on observed values (median, realized volatility, position math)',
        estimated: 'Depends on a modelling assumption that could be wrong (fees, active liquidity from depth, simulations)',
        assumed: 'Supplied by the user or a default with no data behind it',
        mixed: 'Observed price path combined with estimated fees',
      },
    })],
    ['GET', /^\/api\/snapshots$/, () => json(200, { snapshots: storage.listSnapshots().map(snapshotSummary).sort((a, b) => (a.capturedAt < b.capturedAt ? 1 : -1)) })],
    ['POST', /^\/api\/snapshots$/, (_m, body) => {
      const sealed = sealSnapshot(requireBody(body));
      const existed = !!storage.getSnapshot(sealed.id);
      if (!existed) storage.putSnapshot(sealed);
      return json(existed ? 200 : 201, { snapshot: snapshotSummary(sealed), created: !existed });
    }],
    ['POST', /^\/api\/snapshots\/refresh$/, async () => {
      if (!liveProvider) throw new ApiError(503, 'LIVE_DISABLED', mode === 'hosted' ? 'The hosted page cannot make network requests. Run the API server to refresh live data.' : 'Live refresh is disabled on this server.');
      const base = latestSnapshot();
      let raw;
      try {
        raw = await liveProvider({ base });
        if (!raw) throw new ApiError(502, 'UPSTREAM_MALFORMED', 'Live provider returned nothing');
      } catch (e) {
        if (isApiError(e)) { e.details = { ...(e.details || {}), fallbackSnapshotId: base?.id || null }; throw e; }
        throw new ApiError(502, e?.code === 'UPSTREAM_MALFORMED' ? 'UPSTREAM_MALFORMED' : 'UPSTREAM_UNAVAILABLE', String(e?.message || e), { fallbackSnapshotId: base?.id || null });
      }
      let sealed;
      try { sealed = sealSnapshot(raw); } catch (e) {
        throw new ApiError(502, 'UPSTREAM_MALFORMED', 'Live data failed snapshot validation; nothing was stored.', { problems: e.details?.problems, fallbackSnapshotId: base?.id || null });
      }
      storage.putSnapshot(sealed);
      return json(201, { snapshot: snapshotSummary(sealed) });
    }],
    ['GET', /^\/api\/snapshots\/([\w-]+)$/, (m) => json(200, loadSnapshot(m[1]))],
    ['GET', /^\/api\/snapshots\/([\w-]+)\/market$/, (m, _b, q) => {
      const s = loadSnapshot(m[1]);
      const opts = {};
      if (q.volumePolicy) opts.volumePolicy = q.volumePolicy;
      for (const k of ['volumeUsdOverride', 'volatilityOverride', 'volWindowDays']) if (q[k] !== undefined) opts[k] = Number(q[k]);
      const { segs, ...market } = deriveMarket(s, opts);
      return json(200, { snapshotId: s.id, market, liquidityBars: liquidityBars(segs, market.spot.value, Number(q.halfWidthPct) || 25, Number(q.bars) || 100), history: s.history });
    }],
    ['POST', /^\/api\/tiers$/, (_m, body) => {
      const b = requireBody(body);
      const base = loadSnapshot(b.snapshotId);
      const others = Array.isArray(b.compareSnapshotIds) ? b.compareSnapshotIds.map((id) => loadSnapshot(id)) : latestPerTier(base);
      for (const o of others) verifySnapshot(o);
      const { result, resultHash } = compareTiers(base, others, b.inputs);
      return json(200, { resultHash, result });
    }],
    ['POST', /^\/api\/analyze$/, (_m, body) => {
      const b = requireBody(body);
      const snap = loadSnapshot(b.snapshotId);
      const { result, resultHash } = analyze(snap, b.inputs);
      return json(200, { analysisId: analysisId(snap.id, result.inputs), resultHash, result });
    }],
    ['GET', /^\/api\/analyses$/, () => json(200, { analyses: storage.listAnalyses().map(analysisSummary).sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1)) })],
    ['POST', /^\/api\/analyses$/, (_m, body) => {
      const b = requireBody(body);
      const snap = loadSnapshot(b.snapshotId);
      const normalized = normalizeInputs(b.inputs);
      const id = analysisId(snap.id, normalized);
      const prior = storage.getAnalysis(id);
      if (prior) return json(200, { analysis: prior, created: false });
      const rec = record(snap, b.inputs, typeof b.label === 'string' ? b.label.slice(0, 120) : null);
      storage.putAnalysis(rec);
      return json(201, { analysis: rec, created: true });
    }],
    ['GET', /^\/api\/analyses\/([\w-]+)$/, (m) => {
      const a = storage.getAnalysis(m[1]);
      if (!a) throw new ApiError(404, 'ANALYSIS_NOT_FOUND', `No saved analysis '${m[1]}'`);
      return json(200, { analysis: a });
    }],
    ['POST', /^\/api\/analyses\/([\w-]+)\/replay$/, (m) => {
      const a = storage.getAnalysis(m[1]);
      if (!a) throw new ApiError(404, 'ANALYSIS_NOT_FOUND', `No saved analysis '${m[1]}'`);
      return json(200, replay(a));
    }],
    ['GET', /^\/api\/analyses\/([\w-]+)\/bundle$/, (m) => {
      const a = storage.getAnalysis(m[1]);
      if (!a) throw new ApiError(404, 'ANALYSIS_NOT_FOUND', `No saved analysis '${m[1]}'`);
      const { result: _r, ...rec } = a;
      return json(200, { bundleVersion: 1, analysis: rec, snapshot: loadSnapshot(a.snapshotId) });
    }],
    ['POST', /^\/api\/bundles\/import$/, (_m, body) => {
      const b = requireBody(body);
      if (b.bundleVersion !== 1 || !b.analysis || !b.snapshot) throw new ApiError(422, 'BUNDLE_INVALID', 'Expected { bundleVersion: 1, analysis, snapshot }');
      validateSnapshot((({ id, contentHash, ...r }) => r)(b.snapshot));
      verifySnapshot(b.snapshot);
      if (b.analysis.snapshotId !== b.snapshot.id) throw new ApiError(422, 'BUNDLE_INVALID', 'analysis.snapshotId does not match snapshot.id');
      const normalized = normalizeInputs(b.analysis.inputs);
      if (analysisId(b.snapshot.id, normalized) !== b.analysis.id && b.analysis.engineVersion === ENGINE_VERSION) {
        throw new ApiError(422, 'BUNDLE_INVALID', 'analysis.id does not match its snapshot and inputs');
      }
      if (!storage.getSnapshot(b.snapshot.id)) storage.putSnapshot(b.snapshot);
      const r = replay({ ...b.analysis, inputs: normalized });
      if (!storage.getAnalysis(b.analysis.id)) storage.putAnalysis({ ...b.analysis, inputs: normalized, result: r.result });
      return json(200, r);
    }],
  ];

  return async function handle({ method = 'GET', path = '/', query = {}, body } = {}) {
    try {
      if (body === INVALID_JSON) throw new ApiError(400, 'BAD_JSON', 'Request body is not valid JSON');
      let pathMatched = false;
      for (const [m, re, fn] of routes) {
        const match = path.match(re);
        if (!match) continue;
        pathMatched = true;
        if (m !== method) continue;
        return await fn(match, body, query);
      }
      if (pathMatched) throw new ApiError(405, 'METHOD_NOT_ALLOWED', `${method} not allowed on ${path}`);
      throw new ApiError(404, 'NOT_FOUND', `No route ${method} ${path}`);
    } catch (e) {
      if (isApiError(e)) return json(e.status, e.toJSON());
      return json(500, { error: { code: 'INTERNAL', message: String(e?.message || e) } });
    }
  };
}

<script>
/* Uniswap v3 LP Dashboard — the web interface. Every number comes from the API (/api/analyze, /api/tiers). */
(function () {
  const $ = (id) => document.getElementById(id);
  const HOSTED = !!window.LPAPI;
  const S = { snapshotId: null, spot: null, history: null, result: null, view: 'widths' };

  async function api(method, path, body) {
    if (HOSTED) {
      const [p, qs] = path.split('?');
      const out = await window.LPAPI.handle({ method, path: p, query: Object.fromEntries(new URLSearchParams(qs || '')), body: body === undefined ? undefined : JSON.parse(JSON.stringify(body)) });
      if (out.status >= 400) throw Object.assign(new Error(out.body?.error?.message || 'error'), { api: out.body?.error });
      return out.body;
    }
    const res = await fetch(path, { method, headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    const j = await res.json();
    if (!res.ok) throw Object.assign(new Error(j?.error?.message || `HTTP ${res.status}`), { api: j?.error });
    return j;
  }

  const fin = (v) => v !== null && v !== undefined && isFinite(v);
  const usd = (v, d = 0) => (!fin(v) ? '—' : (v < 0 ? '−$' : '$') + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }));
  const susd = (v) => (fin(v) && v > 0 ? '+' : '') + usd(v);
  const musd = (v) => (!fin(v) ? '—' : '$' + (v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1e3 ? (v / 1e3).toFixed(1) + 'k' : v.toFixed(0)));
  const pct = (v, d = 0) => (!fin(v) ? '—' : (v * 100).toFixed(d) + '%');
  const px = (v) => (!fin(v) ? '—' : v.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 }));
  const cls = (v) => (v > 0 ? 'pos' : v < 0 ? 'neg' : '');
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const num = (id) => { const v = $(id).value.trim(); return v === '' ? undefined : Number(v); };
  const setRange = (a, b) => { $('rangeLower').value = a.toFixed(0); $('rangeUpper').value = b.toFixed(0); };

  function inputs() {
    const o = { capitalUsd: num('capitalUsd'), rangeLower: num('rangeLower'), rangeUpper: num('rangeUpper'), horizonDays: num('horizonDays'), liquidityMode: 'follow', compareWidthsPct: [2, 5, 10, 20, 30] };
    for (const k of Object.keys(o)) if (o[k] === undefined) delete o[k];
    return o;
  }

  let timer, seq = 0;
  const schedule = () => { clearTimeout(timer); timer = setTimeout(run, 300); };
  async function run() {
    const my = ++seq;
    document.body.classList.add('busy');
    try {
      const out = await api('POST', '/api/analyze', { snapshotId: S.snapshotId, inputs: inputs() });
      if (my !== seq) return;
      S.result = out.result; $('formStatus').className = 'status'; render();
    } catch (e) {
      if (my !== seq) return;
      const a = e.api;
      $('formStatus').className = 'status err';
      $('formStatus').innerHTML = a?.details?.problems ? a.details.problems.map((p) => esc(`${p.field}: ${p.message}`)).join('<br>') : esc(a?.message || e.message);
    } finally { if (my === seq) document.body.classList.remove('busy'); }
  }

  function render() {
    const r = S.result, m = r.market, pos = r.position, sim = r.simulation, f = r.fees, H = r.inputs.horizonDays;
    const P = pos.entryPrice.value;
    // strip
    const dailyMove = Math.exp(m.volatility.daily) - 1;
    $('stripStats').innerHTML = [
      ['ETH', `$${P.toLocaleString('en-US', { maximumFractionDigits: 2 })}`, 'observed · pool contract (slot0)', 'observed'],
      ['Volatility', `${pct(m.volatility.annual)} <small>±${pct(dailyMove, 1)}/day</small>`, `derived · annualized, last ${m.volatility.n} daily closes`, 'derived'],
      ['Volume / day', musd(m.volume.value), 'derived · 30-day average of GeckoTerminal daily volume', 'derived'],
      ['LP fees / day', musd(f.poolDailyFeesUsd), 'derived · volume × 0.05%', 'derived'],
      ['TVL', musd(m.tvl.value), 'observed · GeckoTerminal', 'observed'],
    ].map(([k, v, t, kind]) => `<div class="stat" title="${esc(t)}"><div class="k">${k} <i class="prov ${kind}"></i></div><div class="v">${v}</div></div>`).join('');
    $('asOf').textContent = `block ${r.snapshot.block} · ${r.snapshot.capturedAt.slice(5, 16).replace('T', ' ')} UTC`;
    $('asOf').title = `snapshot ${r.snapshot.id} · sha256 ${r.snapshot.contentHash}`;
    if (S.savedFor !== JSON.stringify(inputs())) { S.savedId = null; $('repro').textContent = ''; }

    // answer
    const lo = r.risk.atLower, up = r.risk.atUpper, worst = Math.min(lo.ilUsd, up.ilUsd);
    $('aFees').textContent = usd(f.expected.follow);
    $('aFeesS').innerHTML = `${pct(f.expectedApr.follow, 1)} APR · ${H}d`;
    $('aTime').textContent = pct(sim.meanTimeInRange);
    $('aTimeS').innerHTML = `history ${pct(r.historyRolling?.mean)}`;
    $('aEdge').textContent = usd(worst);
    $('aEdgeS').innerHTML = `$${px(lo.price)} <span class="neg">${usd(lo.ilUsd)}</span> · $${px(up.price)} <span class="neg">${usd(up.ilUsd)}</span>`;
    $('aNet').innerHTML = `<span class="${cls(sim.vsHodl.mean)}">${susd(sim.vsHodl.mean)}</span>`;
    $('aNetS').innerHTML = `beats hold ${pct(sim.probBeatHodl)} · after $${r.inputs.gasUsd} gas`;
    const be = r.breakEven;
    $('aBe').textContent = be.volumeUsd === 0 ? 'any' : fin(be.volumeUsd) ? `${musd(be.volumeUsd)}/day` : '—';
    $('aBeS').innerHTML = fin(be.multiple) && be.multiple > 0 ? `${be.multiple.toFixed(1)}× current ${musd(be.currentVolumeUsd)}` : '';
    const sc = r.scenarios.rows;
    $('scnSub').textContent = `steady move over ${H}d`;
    $('scn').innerHTML = '<tr><th>ETH</th><th>Price</th><th>In range</th><th>Fees</th><th>Net vs hold</th></tr>' + sc.map((x) => `<tr class="${x.move === 0 ? 'sel' : ''}"><td>${x.move > 0 ? '+' : ''}${(x.move * 100).toFixed(0)}%</td><td>$${px(x.price)}</td><td>${pct(x.timeInRange)}</td><td>${usd(x.fees)}</td><td class="${cls(x.vsHodl)}">${susd(x.vsHodl)}</td></tr>`).join('');

    $('deposit').innerHTML = [
      ['Range', `$${pos.range.lower.toFixed(2)} – $${pos.range.upper.toFixed(2)}`],
      ['WETH', pos.amounts.weth.toFixed(4)],
      ['USDC', usd(pos.amounts.usdc)],
      ['Split', `${pct(pos.composition.wethPct)} WETH / ${pct(pos.composition.usdcPct)} USDC`],
      ['ETH exposure now', `${pct(r.exposure.now.pctOfPosition)} · ${usd(r.exposure.now.usd)}`],
      [`at $${px(lo.price)} / $${px(up.price)}`, `${pct(r.exposure.atLower.pctOfPosition)} / ${pct(r.exposure.atUpper.pctOfPosition)}`],
    ].map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');

    $('foot').innerHTML = `<span><i class="prov observed"></i> observed: pool contract @ block ${r.snapshot.block}, GeckoTerminal</span><span><i class="prov derived"></i> derived: calculated from observed data</span><span><i class="prov estimated"></i> estimated: model (${sim.params.paths.toLocaleString()} simulations)</span>`;

    // comparison
    const rows = r.comparison.rows;
    $('cmpNote').textContent = S.view === 'tiers' ? '' : `${usd(r.inputs.capitalUsd)} · ${H}d · click a row to apply`;
    $('cmpTable').innerHTML = `<tr><th>Range</th><th>Prices</th><th>Fees</th><th>In range</th><th>Edge loss</th><th>Net vs hold</th><th>Beats hold</th><th>Break-even volume/day</th></tr>` +
      rows.map((x, i) => `<tr class="${x.selected ? 'sel' : 'click'}" data-i="${i}"><td>${x.selected ? '<b>yours</b>' : '±' + x.widthPct + '%'}</td><td>$${px(x.lower)} – $${px(x.upper)}</td><td>${usd(x.expectedFeesFollow)}</td><td>${pct(x.meanTimeInRange)}</td><td class="neg">${usd(Math.min(x.ilAtLower, x.ilAtUpper))}</td><td class="${cls(x.expectedVsHodl)}">${susd(x.expectedVsHodl)}</td><td>${pct(x.probBeatHodl)}</td><td>${fin(x.breakEven.volumeUsd) ? musd(x.breakEven.volumeUsd) : '—'}</td></tr>`).join('');
    $('cmpTable').querySelectorAll('tr.click').forEach((tr) => tr.addEventListener('click', () => { const x = rows[+tr.dataset.i]; setRange(x.lower, x.upper); run(); }));

    draw();
    if (S.view === 'tiers') runTiers();
  }

  // ---------- fee tiers ----------
  let tseq = 0;
  async function runTiers() {
    const my = ++tseq;
    try {
      const out = await api('POST', '/api/tiers', { snapshotId: S.snapshotId, inputs: inputs() });
      if (my !== tseq) return;
      const t = out.result, rows = t.rows, H = t.inputs.horizonDays;
      $('cmpNote').textContent = `same range · ${usd(t.inputs.capitalUsd)} · ${H}d · each pool's own liquidity & volume`;
      if (rows.length < 2) { $('tierTable').innerHTML = '<tr><td class="mut">Only one fee tier in the data. Capture the 0.01% and 0.30% pools to compare.</td></tr>'; $('tierWarn').hidden = true; return; }
      $('tierTable').innerHTML = `<tr><th>Tier</th><th>Range</th><th>TVL</th><th>Volume/day mean · median</th><th>Share</th><th>Fees</th><th>Net vs hold</th><th>@ median volume</th><th>Break-even volume</th></tr>` +
        rows.map((x) => `<tr class="${x.base ? 'sel' : ''}"><td>${x.base ? '<b>' : ''}${+(x.feeTier * 100).toFixed(2)}%${x.base ? '</b>' : ''}</td><td>${px(x.range.lower)}–${px(x.range.upper)}</td><td>${musd(x.tvlUsd)}</td><td>${musd(x.volumeUsd)} · ${musd(x.volumeMedian30)}</td><td>${pct(x.shareNow, 3)}</td><td>${usd(x.expectedFees)}</td><td class="${cls(x.netVsHold)}">${susd(x.netVsHold)}</td><td class="${cls(x.netVsHoldAtMedianVolume)}">${susd(x.netVsHoldAtMedianVolume)}</td><td>${fin(x.breakEvenVolumeUsd) ? musd(x.breakEvenVolumeUsd) : '—'}</td></tr>`).join('');
      const base = rows.find((x) => x.base), lines = [];
      const thin = rows.filter((x) => !x.base && t.warnings.some((w) => w.code === 'TIER_TOO_GOOD' && w.message.startsWith(`${x.feeTier * 100}%`)));
      if (thin.length) lines.push(`${thin.map((x) => `${+(x.feeTier * 100).toFixed(2)}%`).join(' and ')} pool${thin.length > 1 ? 's are' : ' is'} ${thin.map((x) => `${(base.activeL / x.activeL).toFixed(0)}×`).join(' / ')} thinner than ${+(base.feeTier * 100).toFixed(2)}%, so your share looks big. Likely overstated: bot liquidity added around big swaps isn't visible in a snapshot.`);
      const lumpy = rows.filter((x) => x.volumeLumpiness > 1.5);
      if (lumpy.length) lines.push(`Lumpy volume (a few huge days): ${lumpy.map((x) => `${+(x.feeTier * 100).toFixed(2)}% mean ${x.volumeLumpiness.toFixed(1)}× median`).join(' · ')}. Compare the median-volume column.`);
      for (const w of t.warnings) if (w.code === 'TIER_SNAPSHOTS_NOT_SIMULTANEOUS' || w.code === 'TIER_OUT_OF_RANGE') lines.push(w.message);
      $('tierWarn').hidden = !lines.length;
      $('tierWarn').innerHTML = lines.map((l) => `<div>⚠ ${esc(l)}</div>`).join('');
    } catch (e) { if (my === tseq) { $('tierTable').innerHTML = `<tr><td class="neg">${esc(e.message)}</td></tr>`; } }
  }
  function setView(v) {
    S.view = v;
    document.querySelectorAll('#cmpSeg button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
    $('cmpTable').hidden = v !== 'widths'; $('tierTable').hidden = v !== 'tiers';
    if (v !== 'tiers') $('tierWarn').hidden = true;
    if (S.result) render();
  }

  function draw() {
    const r = S.result; if (!r || !S.history) return;
    Charts.priceProfile($('priceChart'), {
      simple: true, history: S.history, spot: r.position.entryPrice.value, cone: r.simulation.cone, bars: r.liquidity.bars, activeL: r.liquidity.activeL, yourL: r.position.liquidity, range: r.position.range,
      onDrag: (b) => setRange(b.lower, b.upper), onRangeChange: (b) => { setRange(b.lower, b.upper); run(); },
    });
  }

  async function save() {
    const out = await api('POST', '/api/analyses', { snapshotId: S.snapshotId, inputs: inputs(), label: `$${num('capitalUsd')} ${$('rangeLower').value}–${$('rangeUpper').value} ${num('horizonDays')}d` });
    S.savedId = out.analysis.id; S.savedFor = JSON.stringify(inputs());
    return out.analysis;
  }
  async function onSave() {
    try { const a = await save(); $('repro').innerHTML = `<span class="mut" title="${a.id}">saved ${a.id.slice(3, 9)}</span>`; }
    catch (e) { $('repro').innerHTML = `<span class="neg">${esc(e.message)}</span>`; }
  }
  async function onVerify() {
    try {
      if (!S.savedId) await save();
      const r = await api('POST', `/api/analyses/${S.savedId}/replay`);
      $('repro').innerHTML = r.reproducible
        ? `<span class="pos" title="${S.savedId} · result hash ${r.recomputedResultHash}">✓ reproduced</span>`
        : `<span class="neg">✗ result changed</span> <span class="mut">${esc(r.note || '')}</span>`;
    } catch (e) { $('repro').innerHTML = `<span class="neg">${esc(e.message)}</span>`; }
  }

  async function init() {
    $('cmpSeg').addEventListener('click', (e) => { if (e.target.dataset.v) setView(e.target.dataset.v); });
    $('saveBtn').addEventListener('click', onSave);
    $('verifyBtn').addEventListener('click', onVerify);
    $('widthChips').innerHTML = [2, 5, 10, 20, 30].map((w) => `<button type="button" data-w="${w}">±${w}%</button>`).join('');
    $('widthChips').addEventListener('click', (e) => { const w = +e.target.dataset.w; if (!w) return; setRange(S.spot * (1 - w / 100), S.spot * (1 + w / 100)); run(); });
    $('form').addEventListener('input', schedule);
    $('form').addEventListener('submit', (e) => { e.preventDefault(); run(); });
    $('themeBtn').addEventListener('click', () => { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; if (S.result) render(); });
    let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(draw, 150); });
    try {
      const { snapshots } = await api('GET', '/api/snapshots');
      const base = snapshots.find((x) => x.pool.address.toLowerCase() === '0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640') || snapshots[0];
      S.snapshotId = base.id;
      const mk = await api('GET', `/api/snapshots/${S.snapshotId}/market`);
      S.spot = mk.market.spot.value;
      const today = base.capturedAt.slice(0, 10);
      S.history = mk.history.filter((d) => d.date < today);
      setRange(S.spot * 0.95, S.spot * 1.05);
      await run();
    } catch (e) { $('formStatus').className = 'status err'; $('formStatus').textContent = e.message; }
  }
  init();
})();

</script>
</body>
</html>
